<!doctype html>
<html lang="vi" data-pwa="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161518">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Địa Ngục">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Giáo Án Địa Ngục</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<style>
/* ===== Giáo Án Địa Ngục · hệ thiết kế PA-22 =====
   Hai giao diện: Hổ Phách (mặc định, tối ấm nhấn cam, theo clip mẫu) và Đen Tuyền (đen OLED nhấn vàng, data-skin="gold").
   Biến --gold* là "màu nhấn" của giao diện đang dùng (giữ tên cũ vì toàn bộ app đang dùng). */
:root{
  --bg:#161518; --surface:#211f23; --surface-2:#2a282d; --surface-3:#353238; --line:rgba(255,255,255,.075); --line-2:rgba(255,255,255,.13);
  --fg:#f4efe8; --fg-2:#bdb6ad; --muted:#8b847c;
  --gold:#ec6a2c; --gold-hi:#ff8b4d; --gold-lo:#c94f17; --gold-ink:#ffffff; --gold-soft:rgb(var(--acc-rgb) / .14);
  --acc-rgb:236 106 44; --acc-hi-rgb:255 139 77;
  --up:#46d184; --up-rgb:70 209 132; --hold:#9db8ff; --hold-rgb:157 184 255; --down:#ff5d50; --down-rgb:255 93 80; --almost:#f4b13d; --warn-rgb:244 177 61;
  --on-up:#06170e; --on-down:#1a0505;
  --top-bg:rgba(22,21,24,.86); --bar-bg:rgba(27,26,29,.94);
  --grad:linear-gradient(90deg,#f7a33a,#ef5a3c 55%,#e8457e);
  --tix-bg:radial-gradient(120% 140% at 85% 0%,#7a4519 0%,#4a2a12 45%,#2e1b0e 100%); --tix-line:#c78a44; --tix-fg:#fff4e3; --tix-fg-2:rgba(255,236,210,.74);
  --tix-num:linear-gradient(180deg,#f6d08a,#c88a3f); --tix-go:#fff1dc; --tix-go-ink:#3a1f0b; --chip-on:#efe1c8; --chip-on-ink:#1d1610;
  --hero-bg:var(--surface); --hero-border:var(--line);
  --font:'Be Vietnam Pro',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; --font-d:var(--font);
  --r-lg:18px; --r:16px; --r-sm:13px; --r-btn:14px; --r-hero:22px; --r-nav:18px; --pill:999px; --nav-h:64px;
  color-scheme:dark;
}
:root[data-skin="gold"]{
  --bg:#000; --surface:#0f0f10; --surface-2:#19191b; --surface-3:#242427; --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.12);
  --fg:#f5f1e6; --fg-2:#b8b2a3; --muted:#827c70;
  --gold:#e2b04f; --gold-hi:#f6cd72; --gold-lo:#b8862f; --gold-ink:#1b1408; --acc-rgb:226 176 79; --acc-hi-rgb:246 205 114;
  --top-bg:rgba(0,0,0,.86); --bar-bg:rgba(10,10,11,.95);
  --grad:linear-gradient(90deg,#f6d07a,#e2a43c 55%,#c9782a);
  --tix-bg:radial-gradient(120% 140% at 85% 0%,#3d3016 0%,#1d170c 50%,#0c0a06 100%); --tix-line:#b8913f; --tix-fg:#fff6e0; --tix-fg-2:rgba(255,240,205,.7);
  --tix-num:linear-gradient(180deg,#fbe2a4,#c99a3c); --tix-go:var(--gold); --tix-go-ink:var(--gold-ink); --chip-on:var(--gold); --chip-on-ink:var(--gold-ink);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5;margin:0;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 32px);-webkit-tap-highlight-color:transparent}
body.resting{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 120px)}
button,input,select,textarea{font:inherit;color:inherit}
button,label[for]{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tn{font-variant-numeric:tabular-nums}
.ico .t{fill:none}
.nav button[aria-current="page"] .ico .t{fill:currentColor;fill-opacity:.22}
.nav .lb{display:block}
.muted{color:var(--muted)} .small{font-size:13px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--top-bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.avatar{width:40px;height:40px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;
  color:var(--gold-ink);background:var(--pc,linear-gradient(140deg,var(--gold-hi),var(--gold-lo)))}
.avatar.pcol{color:#15110a}
.hello{min-width:0;flex:1}
.hello b{display:block;font-size:16px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hello span{font-size:12.5px;color:var(--muted)}
.cycle{font-size:12px;font-weight:700;color:var(--gold);background:var(--gold-soft);border:1px solid rgb(var(--acc-rgb) / .28);padding:6px 11px;border-radius:var(--pill);white-space:nowrap}
.cycle.deload{color:var(--gold-ink);background:var(--gold)}

/* type */
main{padding-block:18px}
.sec{margin-bottom:28px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.h{font-size:19px;font-weight:700;margin:0;letter-spacing:-.01em;text-wrap:balance}
.h1{font-size:28px;font-weight:800;margin:0;line-height:1.15;letter-spacing:-.02em;text-wrap:balance}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--gold)}
.sub{color:var(--fg-2);margin:6px 0 0}
.link{border:0;background:none;color:var(--gold);font-weight:600;font-size:14px;padding:4px 0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 18px;border-radius:var(--r-btn);border:1px solid var(--line-2);
  background:var(--surface-2);font-weight:600;font-size:14.5px;color:var(--fg);text-decoration:none;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.gold{border:0;color:var(--gold-ink);background:linear-gradient(135deg,var(--gold-hi),var(--gold) 55%,var(--gold-lo));box-shadow:0 8px 24px -10px rgb(var(--acc-rgb) / .6)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:4px 14px;font-size:13.5px;border-radius:var(--r-btn)}
.btn.big{min-height:54px;font-size:16px;width:100%;border-radius:var(--r-btn)}
.btn.danger{color:var(--down)}
.btn.danger-fill{background:var(--down);color:var(--on-down);border:0}
.btn:disabled{opacity:.4;cursor:default}
.btn .ico{width:19px;height:19px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.empty{border:1.5px dashed var(--line-2);border-radius:var(--r);padding:18px;color:var(--fg-2);font-size:14px}

/* chips & badges */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:4px 9px;border-radius:var(--pill);background:var(--surface-3);color:var(--fg-2);white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;letter-spacing:.04em;padding:4px 9px;border-radius:var(--pill);white-space:nowrap}
.badge.up{color:var(--up);background:rgb(var(--up-rgb) / .13)}
.badge.almost,.badge.deload{color:var(--gold-hi);background:var(--gold-soft)}
.badge.hold,.badge.start{color:var(--hold);background:rgb(var(--hold-rgb) / .13)}
.badge.down{color:var(--down);background:rgb(var(--down-rgb) / .13)}
.badge.new{color:var(--fg-2);background:var(--surface-3)}

/* banners */
.banner{display:flex;gap:12px;padding:14px;border-radius:var(--r);margin-bottom:16px;background:var(--surface);border:1px solid rgb(var(--acc-rgb) / .3)}
.banner .bi{width:36px;height:36px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--gold-soft);color:var(--gold);font-weight:800}
.banner.info{border-color:rgb(var(--hold-rgb) / .28)} .banner.info .bi{background:rgb(var(--hold-rgb) / .13);color:var(--hold)}
.banner b{display:block;font-size:14.5px}
.banner strong{color:var(--fg)}
.banner p{margin:2px 0 10px;color:var(--fg-2);font-size:13.5px}
.banner p:last-child{margin-bottom:0}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:var(--r-hero);padding:20px 18px 18px;margin-bottom:22px;border:1px solid var(--hero-border);background:var(--hero-bg)}
.hero .h1{margin-top:6px;font-size:30px}
.hero .meta{color:var(--fg-2);font-size:13.5px;margin-top:4px}
.hero ul{list-style:none;margin:16px 0 18px;padding:0;display:flex;flex-direction:column;gap:8px}
.hero li{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px}
.hero li span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg-2)}
.hero li b{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.hero li b.up{color:var(--up)}
.hero .more{font-size:12.5px;color:var(--muted)}

/* day scroller */
.hscroll{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.dcard{scroll-snap-align:start;flex:0 0 152px;text-align:left;display:flex;flex-direction:column;gap:3px;padding:14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);min-height:118px}
.dcard b{font-size:16.5px;font-weight:700;line-height:1.25}
.dcard span{font-size:12.5px;color:var(--fg-2)}
.dcard .last{margin-top:auto;color:var(--muted);font-size:12px}

/* week mini */
.wk{display:flex;flex-direction:column;gap:14px}
.dots{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dots div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--muted)}
.dots i{width:30px;height:30px;border-radius:50%;background:var(--surface-3);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;font-weight:700;color:var(--fg-2)}
.dots .on i{background:linear-gradient(140deg,var(--gold-hi),var(--gold-lo));color:var(--gold-ink)}
.dots .today i{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--gold)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{padding:12px;border-radius:var(--r-sm);background:var(--surface-2)}
.kpi .k{font-size:24px;font-weight:800;line-height:1.1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--fg-2)}

/* lists */
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);width:100%;text-align:left}
.li .lt{font-weight:600;font-size:14.5px;display:block;min-width:0;overflow-wrap:anywhere}
.li .ls{font-size:12.5px;color:var(--muted)}
.li .lr{text-align:right;flex:none}
.li .big{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.arrow{color:var(--up);font-weight:700}
.delta{font-size:12px;font-weight:600}
.delta.good{color:var(--up)} .delta.flat{color:var(--muted)} .delta.other{color:var(--fg-2)} .delta.bad{color:var(--down)}
.kpi .k small{font-size:15px;font-weight:700;margin-left:1px}
.cmpline{margin-top:12px;padding:12px 14px;border-radius:var(--r-sm);background:var(--surface-2);font-size:13.5px;color:var(--fg-2)}
.cmpline b{color:var(--fg)}

/* session */
.sbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 61px);z-index:15;background:var(--bg);padding-block:6px 12px;margin-bottom:6px}
.sbar-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.elapsed{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--gold)}
.prog{height:6px;border-radius:3px;background:var(--surface-3);margin-top:10px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold-lo),var(--gold-hi));border-radius:3px;transition:width .25s}
.prog-l{font-size:12px;color:var(--muted);margin-top:5px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);margin-bottom:14px;overflow:hidden}
.ex-photo{position:relative;display:block;width:100%;aspect-ratio:16/8;max-width:100%;background:var(--surface-2)}
.ex-photo img{width:100%;height:100%;object-fit:cover;display:block}
.ex-photo .cnt{position:absolute;left:12px;bottom:10px;font-size:11.5px;font-weight:600;background:rgba(0,0,0,.6);padding:3px 8px;border-radius:var(--pill)}
.camfab{position:absolute;right:10px;bottom:10px;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(10,10,11,.72);color:var(--gold);border:1px solid rgb(var(--acc-rgb) / .4)}
.camfab .ico{width:20px;height:20px}
.cam-empty{display:flex;align-items:center;gap:12px;margin:14px 14px 0;padding:12px;border-radius:14px;border:1.5px dashed rgb(var(--acc-rgb) / .35);color:var(--fg-2);font-size:13px;background:rgb(var(--acc-rgb) / .04)}
.cam-empty .ci{width:42px;height:42px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--gold-soft);color:var(--gold)}
.cam-empty b{display:block;color:var(--fg);font-size:14px}
.ex-body{padding:14px}
.ex.focus{border-color:rgb(var(--acc-rgb) / .55);box-shadow:0 0 0 1px rgb(var(--acc-rgb) / .25),0 18px 40px -24px rgb(var(--acc-rgb) / .6);scroll-margin-top:calc(env(safe-area-inset-top,0px) + 76px)}
.ex-hero{position:relative;height:min(46vw,260px);background:#000;overflow:hidden}
.ex-hero img{position:absolute;inset:0;width:100%;height:100%}
.ex-hero .blur{object-fit:cover;filter:blur(24px) brightness(.45);transform:scale(1.2)}
.ex-hero .main{object-fit:contain}
.ex-hero.ill{background:#fff}
.ex-hero.ill img{object-fit:contain}
.ex-hero.ill img.b{animation:gfade 3.2s ease-in-out infinite}
.ex-hero .hn{position:absolute;left:12px;top:10px;font-size:11.5px;font-weight:800;letter-spacing:.04em;padding:4px 9px;border-radius:999px;background:rgba(0,0,0,.62);color:#fff}
.ex-hero .hcam{position:absolute;right:10px;bottom:10px;display:flex;align-items:center;gap:6px;padding:7px 11px;border-radius:999px;background:rgba(0,0,0,.62);color:#fff;font-size:12px;font-weight:700;cursor:pointer}
.ex-hero .hcam .ico{width:16px;height:16px}
.ex-hero .hnav{position:absolute;inset:0;display:flex}
.ex-hero .hnav button{flex:1;border:0;background:transparent;cursor:pointer}
.ex-hero .hdots{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:center;gap:5px;pointer-events:none}
.ex-hero .hdots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.45)}
.ex-hero .hdots i.on{background:#fff}
.ex-hero.none{height:auto;display:flex;align-items:center;justify-content:center;padding:18px;background:radial-gradient(circle at 50% 30%,rgb(var(--acc-rgb) / .18),var(--surface-2) 70%)}
.ex-hero.none label{display:flex;align-items:center;gap:8px;color:var(--gold);font-weight:700;font-size:14px;cursor:pointer}
.ex-hero.none .ico{width:22px;height:22px}
.ex-mini{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.ex-mini .mt{flex:1;min-width:0;display:block}
.ex-mini .mn,.ex-mini .ms{display:block}
.ex-mini .mn{font-weight:700;font-size:15px;line-height:1.3;overflow-wrap:anywhere}
.ex-mini .ms{font-size:12.5px;color:var(--fg-2);margin-top:1px}
.ex-mini .mi{flex:none;width:44px;height:44px;border-radius:11px;overflow:hidden;position:relative;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.ex-mini .mi.ill{background:#fff}
.ex-mini .mi img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ex-mini .mk{flex:none;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgb(var(--up-rgb) / .16);color:var(--up)}
.ex-mini .mk .ico{width:16px;height:16px}
.ex-mini .mg{flex:none;font-size:12px;font-weight:700;color:var(--gold)}
.ex.done{opacity:.78}
.ex.next .mn{color:var(--fg)}
.ex-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.ex-name{font-weight:700;font-size:17px;line-height:1.3;min-width:0;overflow-wrap:anywhere}
.ex-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.target{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;padding:12px 14px;border-radius:var(--r-sm);background:var(--surface-2)}
.target .tl{font-size:12px;color:var(--fg-2)}
.target .tv{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums}
.target .tv small{font-size:14px;font-weight:600;color:var(--fg-2)}
.target .tv.up{color:var(--up)}
.target .prev{text-align:right;font-size:12px;color:var(--muted)}
.target .prev b{display:block;font-size:14px;color:var(--fg-2);font-weight:600}
.sug{margin:10px 0 0;font-size:13.5px;color:var(--fg-2)}
.sug strong{color:var(--fg)}
details.setup{margin-top:10px;font-size:13.5px}
details.setup summary{color:var(--gold);font-weight:600;list-style:none}
details.setup summary::-webkit-details-marker{display:none}
details.setup p{margin:6px 0 0;white-space:pre-wrap;color:var(--fg-2)}
.sets{margin-top:14px;display:flex;flex-direction:column;gap:7px}
.sethead,.setrow{display:grid;grid-template-columns:24px 1fr 1fr 46px;gap:8px;align-items:center}
.sethead{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sethead span:nth-child(2),.sethead span:nth-child(3){text-align:center}
.setno{font-weight:800;font-size:15px;color:var(--muted);text-align:center}
.setrow.drop .setno{color:var(--gold)}
.drophead{margin:10px 0 4px;font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--gold)}
.setrow.drop{border-left:3px solid rgb(var(--acc-rgb) / .55);padding-left:6px}
.stepper{display:flex;align-items:stretch;border-radius:var(--r-sm);background:var(--surface-2);border:1px solid var(--line);overflow:hidden;min-width:0;transition:background .15s}
.stepper button{width:34px;border:0;background:transparent;font-size:20px;color:var(--fg-2);flex:none}
.stepper button:active{background:var(--surface-3)}
.stepper input{width:100%;min-width:0;border:0;background:transparent;text-align:center;font-weight:700;font-size:19px;font-variant-numeric:tabular-nums;height:46px;padding:0}
.stepper input:focus{outline:none;background:var(--surface-3)}
.setrow.done .stepper{background:rgb(var(--up-rgb) / .08);border-color:rgb(var(--up-rgb) / .25)}
.check{width:46px;height:46px;border-radius:var(--r-sm);border:1.5px solid var(--line-2);background:transparent;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.check[aria-pressed="true"]{background:var(--up);border-color:var(--up);color:var(--on-up)}
.check .ico{stroke-width:2.6}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.note{width:100%;margin-top:10px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2);padding:10px 12px;font-size:16px;resize:vertical;min-height:44px;color:var(--fg)}
.note::placeholder,.inp::placeholder{color:var(--muted)}
.sess-actions{display:flex;flex-direction:column;gap:8px;margin-top:20px}

/* plan */
.pday{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);margin-bottom:12px;overflow:hidden}
.pday-h{display:flex;align-items:center;gap:12px;padding:16px;width:100%;border:0;background:transparent;text-align:left}
.pday-h .t{flex:1;min-width:0}
.pday-h b{display:block;font-size:18px;font-weight:700}
.pday-h span{font-size:13px;color:var(--fg-2)}
.chev{color:var(--muted);transition:transform .2s}
.pday.open .chev{transform:rotate(90deg)}
.exl{list-style:none;margin:0;padding:0 16px}
.exr{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding-block:10px}
.exr-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;border:0;background:transparent;text-align:left;padding:0}
.exr-main .t{min-width:0;flex:1}
.exr-main .n{display:block;font-weight:600;font-size:14.5px;line-height:1.3;overflow-wrap:anywhere}
.exr-main .m{font-size:12px;color:var(--muted)}
.exr-kg{text-align:right;flex:none}
.exr-kg b{display:block;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.exr-kg span{font-size:11.5px;color:var(--up);font-weight:600;white-space:nowrap}
.exr-kg span.none{color:var(--gold)}
.thumb{width:48px;height:48px;border-radius:13px;object-fit:cover;background:var(--surface-3);display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
img.thumb{display:block}
.thumb .ico{width:22px;height:22px}
.mv{display:flex;flex-direction:column;gap:3px}
.mv button{width:30px;height:24px;border-radius:7px;border:1px solid var(--line);background:transparent;color:var(--fg-2);padding:0;display:flex;align-items:center;justify-content:center}
.mv .ico{width:16px;height:16px}
.pday-a .btn .ico{width:17px;height:17px}
.mv button:disabled{opacity:.3}
.pday-a{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px 16px;border-top:1px solid var(--line)}

/* progress tab */
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.weeknav .btn{width:44px;padding:0}
.weeknav .wl{font-size:19px;font-weight:700;text-align:center}
.vol{display:flex;flex-direction:column;gap:12px}
.vrow{display:grid;grid-template-columns:84px 1fr 56px;gap:10px;align-items:center}
.vrow .vn{font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vtrack{position:relative;height:12px;border-radius:6px;background:var(--surface-3)}
.vband{position:absolute;top:0;bottom:0;background:rgb(var(--acc-rgb) / .16);border-left:1.5px solid rgb(var(--acc-rgb) / .55);border-right:1.5px solid rgb(var(--acc-rgb) / .55)}
.vfill{position:absolute;left:0;top:3px;bottom:3px;border-radius:0 4px 4px 0;background:var(--fg-2)}
.vrow .vv{font-size:16px;font-weight:800;text-align:right;font-variant-numeric:tabular-nums;line-height:1.1}
.vrow .vv small{display:block;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.st-low{color:var(--gold-hi)} .st-ok{color:var(--up)} .st-high{color:var(--hold)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:12px}
.legend i{display:inline-block;width:18px;height:9px;border-radius:3px;vertical-align:middle;margin-right:6px;background:rgb(var(--acc-rgb) / .16);border:1.5px solid rgb(var(--acc-rgb) / .55)}

/* body */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:18px}
.tile{padding:13px 14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.tile .tl{font-size:12px;font-weight:600;color:var(--fg-2)}
.tile .tv{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.2;font-variant-numeric:tabular-nums}
.tile .tv small{font-size:13px;font-weight:600;color:var(--fg-2);margin-left:3px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--pill);padding:7px 13px;font-size:13px;font-weight:600;color:var(--fg-2)}
.chips button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.chart{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:10px 6px 4px;margin-bottom:18px;touch-action:pan-y}
.sheet-panel .chart{background:var(--surface-2)}
.chart svg{display:block;width:100%}
.chart .ctitle{font-size:13px;font-weight:600;color:var(--fg-2);padding:2px 10px 0}
.chart .tip{position:absolute;pointer-events:none;background:var(--fg);color:var(--bg);font-size:12px;padding:5px 9px;border-radius:9px;white-space:nowrap;transform:translate(-50%,-100%)}
.chart .tip b{font-size:14px}
.chart .nodata{padding:28px 12px;text-align:center;color:var(--muted);font-size:14px}

/* roadmap */
.road{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.road::-webkit-scrollbar{display:none}
.road div{flex:0 0 auto;min-width:78px;padding:10px 12px;border-radius:var(--r-sm);background:var(--surface-2);border:1px solid var(--line)}
.sheet-panel .road div{background:var(--surface-3)}
.road div.now{border-color:var(--gold);background:var(--gold-soft)}
.road div.dl{border-style:dashed;border-color:var(--line-2)}
.road span{display:block;font-size:11px;font-weight:600;color:var(--muted);white-space:nowrap}
.road b{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.road div.hit b{color:var(--up)}
.eta{font-size:13.5px;color:var(--fg-2);margin:10px 0 0}
.eta b{color:var(--fg)}

/* forms */
.fsec{margin-top:20px}
.fsec > .eyebrow{display:block;margin-bottom:10px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--fg-2);min-width:0}
label.f.full,.full{grid-column:1/-1}
.inp{width:100%;min-height:48px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface-2);padding:10px 12px;font-size:16px;color:var(--fg);font-weight:500}
.inp:focus{outline:none;border-color:var(--gold)}
select.inp{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 21px,calc(100% - 13px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
textarea.inp{min-height:88px;resize:vertical}
.inp.kg{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.unit{font-weight:500;color:var(--muted)}
.fhint{font-size:12px;color:var(--muted);font-weight:400;margin:0}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;padding:0 4px;font-size:14.5px;font-weight:600}
.toggle input{appearance:none;-webkit-appearance:none;width:48px;height:28px;border-radius:var(--pill);background:var(--surface-3);position:relative;transition:background .2s;flex:none;margin:0}
.toggle input::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:var(--fg-2);transition:transform .2s,background .2s}
.toggle input:checked{background:var(--gold)}
.toggle input:checked::after{transform:translateX(20px);background:var(--gold-ink)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:var(--r-btn);background:var(--surface-2);border:1px solid var(--line)}
.seg button{border:0;background:transparent;border-radius:calc(var(--r-btn) - 3px);min-height:40px;font-size:13.5px;font-weight:600;color:var(--fg-2);padding:4px 6px}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink)}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.ph{position:relative}
.ph img{width:78px;height:78px;object-fit:cover;border-radius:13px;display:block;background:var(--surface-3)}
.ph button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:2px solid var(--surface);background:var(--fg);color:var(--bg);padding:0;display:flex;align-items:center;justify-content:center}
.ph button .ico{width:13px;height:13px;stroke-width:2.6}
.addph{width:78px;height:78px;border-radius:13px;border:1.5px dashed rgb(var(--acc-rgb) / .45);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--gold);background:rgb(var(--acc-rgb) / .05)}
.addph.lib{border-color:var(--line-2);color:var(--fg-2);background:transparent}
.qpick{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.qpick button{border:1px solid var(--line-2);background:var(--surface-2);border-radius:var(--pill);padding:6px 12px;font-size:13px;font-weight:500}

/* me */
.set-card{margin-bottom:12px}
.set-card h3{font-size:16px;font-weight:700;margin:0 0 4px}
.set-card > p{margin:0 0 12px;color:var(--fg-2);font-size:13.5px}
.rules{font-size:13.5px;color:var(--fg-2)}
.rules h4{font-size:14px;color:var(--fg);margin:14px 0 4px}
.rules ul{margin:0;padding-left:18px}
.rules li{margin-bottom:4px}
.tbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.tbl th,.tbl td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tbl-wrap{overflow-x:auto}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:0 12px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.nav .bar{max-width:536px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h);padding:6px;border-radius:var(--r-nav);pointer-events:auto;
  background:var(--bar-bg);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line-2);box-shadow:0 12px 30px -12px rgba(0,0,0,.8)}
.nav button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;background:transparent;color:var(--muted);font-size:10.5px;font-weight:600;border-radius:calc(var(--r-nav) - 6px)}
.nav button[aria-current="page"]{color:var(--gold);background:var(--gold-soft)}
.nav .dot{position:absolute;top:8px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--down);box-shadow:0 0 0 2px var(--surface)}

/* rest */
.rest{position:fixed;left:0;right:0;z-index:29;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 16px);padding-inline:12px}
.rest-in{position:relative;overflow:hidden;max-width:536px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:12px 14px 14px;border-radius:var(--r-lg);
  background:linear-gradient(135deg,var(--gold-hi),var(--gold) 60%,var(--gold-lo));color:var(--gold-ink);box-shadow:0 12px 30px -10px rgb(var(--acc-rgb) / .55)}
.rest-bar{position:absolute;left:0;bottom:0;height:4px;width:100%;background:color-mix(in srgb,var(--gold-ink) 50%,transparent);transform-origin:left}
.rest-l{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.rest-t{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.02em}
.rest button{border:0;background:color-mix(in srgb,var(--gold-ink) 14%,transparent);color:var(--gold-ink);border-radius:var(--r-sm);padding:8px 12px;font-size:13px;font-weight:700}
.rest .sp{margin-left:auto}

/* sheet */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.66)}
.sheet-panel{position:relative;width:100%;max-width:560px;max-height:93vh;max-height:93dvh;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);
  border-radius:var(--r-hero) var(--r-hero) 0 0;border-top:1px solid var(--line-2);padding:10px 16px calc(22px + env(safe-area-inset-bottom,0px))}
.sheet-panel .inp{background:var(--surface-2)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--surface-3);margin:0 auto 14px}
/* PA-40: nút × đóng popup */
.sheet-x{position:absolute;top:8px;right:10px;z-index:2;width:36px;height:36px;border-radius:50%;border:0;background:var(--surface-2);color:var(--fg-2);font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer}
/* PA-40 · BR-27.4 (chỉnh 23/10): chữ không sửa được thì không chọn được; ô nhập và ô soạn thảo vẫn chọn được */
body,body *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select,[contenteditable="true"]{-webkit-user-select:text;user-select:text}
.cmp,.cmp *,.chart,.chart *{-webkit-user-select:none;user-select:none}
.sh-title{font-size:22px;font-weight:800;margin:0 0 4px;line-height:1.2;letter-spacing:-.01em;text-wrap:balance}
.sh-text{color:var(--fg-2);margin:0 0 14px;font-size:14px}
.sh-actions{display:flex;flex-direction:column;gap:8px;margin-top:20px}
.pr{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;word-break:break-all}

/* viewer */
.viewer{position:fixed;inset:0;z-index:60;background:#000;display:flex;flex-direction:column;color:#f6f3ec;
  padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.viewer .vtop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.viewer .vtop b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.viewer button,.viewer label{border:1px solid rgba(255,255,255,.22);background:transparent;color:#f6f3ec;border-radius:12px;min-height:40px;padding:6px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.viewer label{color:var(--gold);border-color:rgb(var(--acc-rgb) / .45)}
.viewer .vimg{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding-block:12px}
.viewer .vimg img{max-height:100%;max-width:100%;object-fit:contain;border-radius:12px}
.viewer .vcap{white-space:pre-wrap;font-size:14px;color:#cfc9bd;max-height:26vh;overflow:auto;background:#141416;border-radius:14px;padding:12px}
.viewer .vnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 100px);z-index:70;
  background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:14px;font-size:14px;font-weight:600;width:max-content;max-width:calc(100% - 32px);text-align:center;box-shadow:0 10px 30px -10px rgba(0,0,0,.8)}
/* alarm popup */
.alarm{position:fixed;inset:0;z-index:65;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.alarm-in{width:100%;max-width:340px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:26px 20px 20px;border-radius:var(--r-hero);background:var(--surface);border:1px solid rgb(var(--acc-rgb) / .45);box-shadow:0 0 0 6px rgb(var(--acc-rgb) / .12),0 24px 60px -20px rgba(0,0,0,.8)}
.alarm-in{position:relative}
.alarm-ico{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--gold);color:var(--gold-ink);margin-bottom:8px;animation:ring 1s ease-in-out infinite}
.alarm-ico .ico{width:32px;height:32px;stroke-width:2}
.alarm-in b{font-family:var(--font-d);font-size:26px;font-weight:800}
.alarm-in span{color:var(--fg-2);font-size:14px;margin-bottom:12px}
@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(-14deg)}40%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(5deg)}}
.diag{margin-top:12px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.diag div{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:var(--r-sm);background:var(--surface-2)}
.diag b{font-weight:700} .diag .ok{color:var(--up)} .diag .no{color:var(--gold-hi)}
/* sync */
.sync-h{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.sync-h h3{margin:0}
.sync-dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
.sync.ok .sync-dot{background:var(--up);box-shadow:0 0 0 4px rgb(var(--up-rgb) / .15)}
.sync.warn{border-color:rgb(var(--acc-rgb) / .35)} .sync.warn .sync-dot{background:var(--gold)}
/* warm-up */
.warm{margin-top:12px;padding:10px 12px;border-radius:14px;border:1px dashed var(--line-2)}
.warm-h{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--gold)}
.warm-h .ico{width:16px;height:16px}
.warm-h span{font-weight:500;color:var(--muted);margin-left:auto;font-size:12px}
.warm-sets{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.warm-sets button{border:1px solid var(--line-2);background:var(--surface-2);border-radius:10px;padding:6px 10px;font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--fg)}
.warm-sets button small{font-weight:500;color:var(--muted);margin-left:2px}
.warm-sets button[aria-pressed="true"]{background:rgb(var(--up-rgb) / .12);border-color:rgb(var(--up-rgb) / .35);color:var(--up)}
/* body photos */
.bp-strip{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-bottom:14px}
.bp-strip::-webkit-scrollbar{display:none}
.bp-strip button{flex:0 0 auto;width:86px;border:0;padding:0;background:none;text-align:left;color:var(--fg-2);display:flex;flex-direction:column;gap:4px}
.bp-strip img{width:86px;height:114px;object-fit:cover;border-radius:12px;display:block;background:var(--surface-3)}
.bp-strip span{font-size:11.5px;font-weight:600}
.cmp-sel{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.cmp-sel .inp{min-height:44px;font-size:16px}
.cmp{position:relative;aspect-ratio:3/4;max-width:100%;border-radius:18px;overflow:hidden;background:var(--surface-2);user-select:none;-webkit-user-select:none;touch-action:pan-y}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.cmp .handle{position:absolute;top:0;bottom:0;left:50%;width:2px;background:var(--gold);transform:translateX(-1px);pointer-events:none}
.cmp .handle i{position:absolute;top:50%;left:50%;width:36px;height:36px;border-radius:50%;transform:translate(-50%,-50%);background:var(--gold);color:var(--gold-ink);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.5)}
.cmp .handle .ico{width:18px;height:18px;stroke-width:2.2}
.cmp .tag{position:absolute;top:10px;font-size:12px;font-weight:700;background:rgba(0,0,0,.65);padding:4px 9px;border-radius:var(--pill);color:#f6f3ec}
.cmp .tag.l{left:10px} .cmp .tag.r{right:10px;color:var(--gold-hi)}
.cmp-range{width:100%;margin:12px 0 0;accent-color:var(--gold)}
.note-line{font-size:12.5px;color:var(--muted);margin:10px 0 0}
/* schedule */
.sched{display:flex;flex-direction:column;gap:6px}
.sched label{display:grid;grid-template-columns:76px 1fr;align-items:center;gap:10px;font-size:14px;font-weight:600;color:var(--fg-2)}
.sched select{width:100%;min-height:44px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--surface-2);color:var(--fg);font-size:16px;font-weight:600;padding:6px 12px;appearance:none;-webkit-appearance:none}
.sched select.on{border-color:var(--gold);background:var(--gold-soft);color:var(--gold-hi)}
.dots .plan i{box-shadow:inset 0 0 0 1.5px var(--gold);background:transparent;color:var(--gold)}
.miss{color:var(--gold);font-weight:600}

.li.pick .pk{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line-2);display:flex;align-items:center;justify-content:center;color:transparent;flex:none}

/* ===== chuyển động ===== */
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
html,body{overscroll-behavior-y:none;overflow-x:hidden;max-width:100%}
@supports (overflow:clip){html,body{overflow-x:clip}}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
*{touch-action:manipulation}
.hscroll,.chips,.road,.bp-strip,.tbl-wrap{overscroll-behavior-x:contain}
main,#view{max-width:100%;overflow-x:clip}
img,svg,canvas,video{max-width:100%}
.rest-t{display:inline-block;transform-origin:left center}
/* 3. kéo xuống để làm mới */
#ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 66px);z-index:19;width:34px;height:34px;margin-left:-17px;border-radius:50%;opacity:0;pointer-events:none;
  background:var(--surface-2);border:1px solid var(--line-2);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px -6px rgba(0,0,0,.6)}
#ptr i{width:16px;height:16px;border-radius:50%;border:2.2px solid var(--gold);border-right-color:transparent;display:block}
#ptr.ready i{border-color:var(--up);border-right-color:transparent}
#ptr.spin{opacity:1!important}
#ptr.spin i{animation:spin360 .7s linear infinite}
@keyframes spin360{to{transform:rotate(360deg)}}
/* 6. bấm ✓ nảy */
.check.pop{animation:pop .42s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.setrow.flash{animation:flash .7s ease-out}
@keyframes flash{0%{background:rgb(var(--up-rgb) / .28)}100%{background:transparent}}
.prog i{transition:width .45s cubic-bezier(.2,1.2,.4,1)}
/* 8. chuyển tab */
#view.enter{animation:view-in .34s cubic-bezier(.2,.8,.2,1)}
@keyframes view-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:360px){.stepper button{width:28px}.sethead,.setrow{grid-template-columns:18px 1fr 1fr 44px;gap:6px}.check{width:44px}}

/* display face */
.h1,.sh-title,.kpi .k,.tile .tv,.target .tv,.elapsed,.rest-t,.li .big,.road b,.vrow .vv,.exr-kg b,.hero li b,.weeknav .wl,.setno{font-family:var(--font-d)}
/* guide */
details.guide{margin-top:12px;font-size:13.5px;color:var(--fg-2);background:var(--surface-2);border-radius:var(--r-sm);padding:10px 12px}
details.guide summary{color:var(--gold);font-weight:600}
details.guide ol{margin:8px 0 2px;padding-left:20px;display:flex;flex-direction:column;gap:6px}

/* v14: đau, HLV, thời gian */
.badge.pain{color:var(--down);background:rgb(var(--down-rgb) / .13)}
.banner.pain{border-color:rgb(var(--down-rgb) / .45)}
.banner.pain .bi{background:rgb(var(--down-rgb) / .14);color:var(--down)}
.qpick button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);font-weight:700}
.redflag{margin-top:14px;padding:12px 14px;border-radius:var(--r-sm);background:rgb(var(--down-rgb) / .1);border:1px solid rgb(var(--down-rgb) / .3);font-size:13px;line-height:1.45;color:var(--fg-2)}
.redflag b{color:var(--down)}
.painrow{display:flex;align-items:center;gap:10px;cursor:default}
.painrow .btn{flex:none}
.hero .meta.painl{font-weight:700}
.coach{display:block;width:100%;text-align:left;color:inherit;font:inherit;margin-top:12px;padding:14px;border-radius:var(--r);background:var(--surface-2);border:1px solid var(--line)}
.coach.cur{border-color:rgb(var(--acc-rgb) / .5)}
.coach .ch{display:flex;align-items:center;gap:10px}
.coach .ch b{font-size:16px}
.coach .kpis{margin-top:12px}
.coach .cl{display:flex;gap:8px;margin-top:8px;font-size:13px;line-height:1.4;color:var(--fg-2)}
.coach .cl i{font-style:normal;flex:none;width:18px;text-align:center;font-weight:800}
.coach .cl.up i{color:var(--up)} .coach .cl.miss i,.coach .cl.down i,.coach .cl.pain i{color:var(--down)} .coach .cl.ok i{color:var(--up)}
.coach .cl b{color:var(--fg)}
.etm{font-variant-numeric:tabular-nums}
.coach .kpi .k,.coach .kpi .l{display:block}

/* ===== v16 ===== */
/* khoá trượt ngang toàn app: chỉ cho cuộn dọc, riêng các dải cuộn ngang được vuốt ngang */
html,body,main,#view,.sheet,.sheet-panel,.sheet-bg{touch-action:pan-y}
.hscroll,.chips,.road,.bp-strip,.tbl-wrap,.qpick.scroll{touch-action:pan-x pan-y}
.sheet,.sheet-panel{overflow-x:hidden;overscroll-behavior-x:none}
.sheet-panel>*,.formgrid>*,.f,.inp{min-width:0;max-width:100%}
.inp,select.inp,textarea.inp{box-sizing:border-box}
input,select,textarea{font-size:16px}
input[type=checkbox],input[type=radio]{font-size:inherit}
/* chuyển động */
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
@keyframes sheet-up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet:not([hidden]) .sheet-panel{animation:sheet-up .34s cubic-bezier(.2,.9,.25,1)}
.sheet:not([hidden]) .sheet-bg{animation:fade-in .25s ease}
@keyframes fade-in{from{opacity:0}}
:is(.btn,.li,.dcard,.pday-h,.exr-main,.coach,.tile,.skin,.qpick button,.seg button,.wks span){transition:transform .18s cubic-bezier(.2,.8,.2,1),background-color .2s,box-shadow .2s,color .2s}
:is(.btn,.li,.dcard,.pday-h,.exr-main,.coach,.tile,.skin,.qpick button,.seg button):active{transform:scale(.965)}
@keyframes navpop{0%{transform:scale(.6) translateY(4px)}55%{transform:scale(1.22) translateY(-3px)}100%{transform:none}}
.nav button.pop>.ico,.nav button.pop .fabc{animation:navpop .5s cubic-bezier(.3,1.5,.5,1)}
@keyframes draw{from{stroke-dashoffset:100}}
.spk{display:block;width:52px;height:16px;margin:3px 0 0 auto;overflow:visible}
.spk polyline{fill:none;stroke:var(--up);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:100}
.spk circle{fill:var(--up)}
#view.enter .spk polyline,.rv-now .spk polyline{animation:draw 1.1s .25s cubic-bezier(.4,0,.2,1) both}

  color:var(--dc);background:color-mix(in srgb,var(--dc) 14%,transparent);border:1px solid color-mix(in srgb,var(--dc) 35%,transparent)}

.pday-h .pmeta{display:block;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}   /* PA-40 · BR-27.9: một dòng ngang dưới tiêu đề */

.mx{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:2px}

.bmore{margin-top:10px}
.bcmp{margin-bottom:12px}

.viewer .vbp{justify-content:stretch} .viewer .vbp button{flex:1;justify-content:center}
.bpn{display:flex;flex-direction:column;gap:10px;margin-top:12px}

.wprow .ctl .stp button{width:32px;height:32px;padding:0;border-radius:10px;font-size:16px}

.wpkeep{margin-top:12px}

.wpchip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:var(--pill);background:var(--gold-soft);color:var(--gold);margin-top:8px}
.coachcard{border-color:rgb(var(--acc-rgb) / .45)}
.coachcard h3{display:flex;align-items:center;gap:8px}
.coachcard h3 .ico{width:20px;height:20px;color:var(--gold)}
[data-act="ph-rm"].armed{background:#e5484d!important;color:#fff!important;transform:scale(1.15)}
/* Thẻ khoe buổi tập */
.paste-box{margin-top:10px;display:flex;gap:8px}
.paste-box .inp{flex:1;min-width:0;font-size:14px}
/* nút: lún xuống rồi nảy lên */
:root[data-anim="on"] .btn{transition:transform .32s cubic-bezier(.3,1.7,.5,1),box-shadow .2s,background-color .2s,border-color .2s}
:root[data-anim="on"] .btn:active{transform:scale(.94);transition-duration:.08s}
:root[data-anim="on"] .check{transition:transform .32s cubic-bezier(.3,1.7,.5,1)}
:root[data-anim="on"] .check:active{transform:scale(.88);transition-duration:.06s}
/* xong bài: thẻ thu gọn, dấu tích tự vẽ; bài kế tiếp trượt lên */
:root[data-anim="on"] .ex.done.just{animation:collapse .5s cubic-bezier(.2,.8,.2,1)}
:root[data-anim="on"] .ex.done.just .mk{animation:pop .5s cubic-bezier(.3,1.7,.5,1) .1s both}
:root[data-anim="on"] .ex.done.just .mk svg *{stroke-dasharray:40;stroke-dashoffset:40;animation:drawck .45s ease-out .3s forwards}
@keyframes drawck{to{stroke-dashoffset:0}}
@keyframes collapse{0%{transform:scale(1.02);opacity:.6}100%{transform:none;opacity:.78}}
:root[data-anim="on"] .ex.focus.arrive{animation:arrive .55s cubic-bezier(.2,.9,.25,1) both,breathe 3.2s ease-in-out infinite .6s}
@keyframes arrive{from{opacity:0;transform:translateY(26px) scale(.97)}to{opacity:1;transform:none}}
:root[data-anim="on"] .ex.focus.arrive .ex-hero img.main,:root[data-anim="on"] .ex.focus.arrive .ex-hero.ill img.a{animation:heroin .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes heroin{from{transform:scale(1.08);opacity:.2}to{transform:none;opacity:1}}
/* đồng hồ nghỉ: 3 giây cuối đập theo nhịp, thanh nhấp nháy */
:root[data-anim="on"] .rest-t.beat{animation:beat .55s cubic-bezier(.3,1.6,.5,1)}
@keyframes beat{0%{transform:scale(1)}30%{transform:scale(1.28)}100%{transform:scale(1)}}
:root[data-anim="on"] .rest-in.final .rest-bar{animation:barflash .5s ease-in-out infinite alternate}
@keyframes barflash{to{opacity:.35}}
/* tắt hiệu ứng */
:root[data-anim="off"] *,:root[data-anim="off"] *::before,:root[data-anim="off"] *::after{animation:none!important;transition-duration:0s!important}
/* thẻ, dòng, ngày tập: lún nhẹ khi bấm rồi bật lại */
:root[data-anim="on"] :is(.li,.dcard,.ex-mini,.skin,.kpi,.tile){transition:transform .35s cubic-bezier(.3,1.6,.5,1),border-color .2s,box-shadow .2s}
:root[data-anim="on"] :is(.li,.dcard,.ex-mini,.skin):active{transform:scale(.97);transition-duration:.08s}
/* nút gạt và nút chọn: bật có độ nảy */
:root[data-anim="on"] .toggle input::after{transition:transform .38s cubic-bezier(.3,1.7,.5,1),background .2s}
:root[data-anim="on"] .toggle input:checked{animation:tgl .4s ease-out}
@keyframes tgl{0%{box-shadow:0 0 0 0 rgb(var(--acc-rgb) / .55)}100%{box-shadow:0 0 0 10px rgb(var(--acc-rgb) / 0)}}
:root[data-anim="on"] .seg button[aria-pressed="true"]{animation:segpop .38s cubic-bezier(.3,1.6,.5,1)}
@keyframes segpop{0%{transform:scale(.88)}100%{transform:none}}
/* bảng trượt lên có độ nảy, nền phía sau mờ dần */
:root[data-anim="on"] .sheet:not([hidden]) .sheet-panel{animation:sheet-spring .5s cubic-bezier(.2,1.25,.35,1)}
@keyframes sheet-spring{from{transform:translateY(70px);opacity:.3}to{transform:none;opacity:1}}
:root[data-anim="on"] .sheet-bg{backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
/* thông báo nhỏ nảy lên */
:root[data-anim="on"] .toast:not([hidden]){animation:toastin .45s cubic-bezier(.3,1.5,.5,1)}
@keyframes toastin{from{opacity:0;transform:translateX(-50%) translateY(26px) scale(.9)}to{opacity:1;transform:translateX(-50%)}}
/* ✓ xong set: dấu tích xoay vào */
:root[data-anim="on"] .check[aria-pressed="true"] svg{animation:ckspin .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes ckspin{from{transform:rotate(-90deg) scale(.3)}to{transform:none}}
/* đổi tab: trượt nhanh, gọn */
:root[data-anim="on"] #view.enter{animation:tabin .16s cubic-bezier(.2,.9,.3,1)}
@keyframes tabin{from{opacity:.4;transform:translateX(14px)}to{opacity:1;transform:none}}
/* bấm ✓: nút dập xuống rồi bật, cả dòng đổi màu đặc */
:root[data-anim="on"] .check.pop{animation:slam .26s cubic-bezier(.2,1.8,.4,1)}
@keyframes slam{0%{transform:scale(1.4)}45%{transform:scale(.86)}100%{transform:scale(1)}}
:root[data-anim="on"] .setrow.flash{animation:hit .5s ease-out}
@keyframes hit{0%{background:rgb(var(--acc-rgb) / .6)}100%{background:transparent}}
/* xong bài: dấu XONG đóng lên thẻ */
.donebar{display:flex;align-items:center;gap:12px;margin:12px 0 0;padding:10px 12px;border-radius:var(--r-sm);background:rgb(var(--up-rgb) / .1);border:1px solid rgb(var(--up-rgb) / .35)}
.donebar .ds{font-size:13px;font-weight:700;color:var(--fg-2);line-height:1.35;min-width:0}
.donebar .ds b{color:var(--fg)}
.stamp{flex:none;display:inline-block;font-family:var(--font-d);font-weight:900;font-size:18px;letter-spacing:.14em;padding:3px 12px;border:3px solid var(--up);color:var(--up);border-radius:8px;transform:rotate(-6deg)}
:root[data-anim="on"] .stamp.in{animation:stamp .34s cubic-bezier(.2,1.6,.4,1)}
@keyframes stamp{0%{transform:scale(2.8) rotate(-16deg);opacity:0}60%{transform:scale(.9) rotate(-5deg);opacity:1}100%{transform:scale(1) rotate(-6deg)}}
:root[data-anim="on"] .ex.focus.shake{animation:shake .32s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.nextex{width:100%;margin-top:12px;justify-content:center}
/* phá kỷ lục: dải chữ đập ngang màn hình */
.slam{position:fixed;left:0;right:0;top:30%;z-index:90;pointer-events:none;background:var(--gold);color:var(--gold-ink);padding:18px 16px;text-align:center;box-shadow:0 20px 50px -10px rgba(0,0,0,.7);animation:slamin 2.2s cubic-bezier(.2,1.4,.3,1) forwards}
.slam b{display:block;font-family:var(--font-d);font-weight:900;font-size:34px;letter-spacing:.08em;line-height:1}
.slam span{display:block;font-weight:800;font-size:15px;margin-top:6px}
@keyframes slamin{0%{transform:scaleY(0) skewY(-4deg)}12%{transform:scaleY(1.15) skewY(-4deg)}20%{transform:scaleY(1) skewY(-4deg)}85%{opacity:1;transform:skewY(-4deg)}100%{opacity:0;transform:translateX(30px) skewY(-4deg)}}
:root[data-anim="on"] body.quake #view{animation:shake .32s cubic-bezier(.36,.07,.19,.97)}
/* hết giờ nghỉ: viền màn hình chớp đỏ */
body.restflash::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:95;box-shadow:inset 0 0 0 7px var(--down);animation:edgeflash .5s steps(1) 4}
@keyframes edgeflash{50%{opacity:0}}
/* thanh bài tập dính đầu màn hình */
.exnav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:10px;padding-bottom:2px}
.exnav::-webkit-scrollbar{display:none}
.exnav button{flex:none;min-width:40px;height:34px;padding:0 10px;border-radius:17px;border:1px solid var(--line-2);background:var(--surface);color:var(--fg-2);font:inherit;font-size:13px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.exnav button.ok{background:rgb(var(--up-rgb) / .16);border-color:rgb(var(--up-rgb) / .5);color:var(--up)}
.exnav button.cur{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.exnav button.cur.ok{background:var(--up);border-color:var(--up);color:var(--on-up)}
/* bài đã xong: hiện rõ, không mờ */
.ex.done{opacity:1;border-left:3px solid var(--up)}
.ex.done .ex-mini .ms{color:var(--fg)}
/* gợi ý tạ: 1 dòng nhỏ */
.target{align-items:center}
.sugchip{display:inline-flex;align-items:center;gap:4px;margin-top:6px;padding:3px 10px;border-radius:12px;font-size:12.5px;font-weight:700;border:1px solid var(--line-2);background:var(--surface-2);color:var(--fg-2)}
.sugchip.up{border-color:rgb(var(--up-rgb) / .5);color:var(--up)}
.sugchip.down{border-color:rgb(var(--down-rgb) / .5);color:var(--down)}
.stepchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.stepchips button{min-width:44px;height:32px;border-radius:16px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--fg);font:inherit;font-size:13px;font-weight:700}
.stepchips button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}

/* ===== PA-13: chấm độ khó set ===== */
.setrow .eff{grid-column:1/-1;display:flex;align-items:center;gap:6px;margin:-2px 0 2px}
.eff span{font-size:11.5px;color:var(--muted);font-weight:700;margin-right:auto;padding-left:30px}
.eff button{height:28px;padding:0 11px;border-radius:14px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--fg-2);font:inherit;font-size:12.5px;font-weight:700}
.eff button[aria-pressed="true"].e{background:var(--up);border-color:var(--up);color:var(--on-up)}
.eff button[aria-pressed="true"].m{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.eff button[aria-pressed="true"].h{background:#f0a020;border-color:#f0a020;color:#1b1406}
.eff button[aria-pressed="true"].f{background:var(--down);border-color:var(--down);color:#fff}
.effl{color:var(--fg-2);font-weight:600}


/* ===== PA-16: thông báo của app (Web Push) ===== */
.ncard .dows{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ncard .dows button{min-width:40px;height:34px;border-radius:17px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--fg-2);font:inherit;font-size:13px;font-weight:800}
.ncard .dows button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.ncard .nst{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin:10px 0 0}
.ncard .nst i{width:9px;height:9px;border-radius:50%;background:var(--muted)} .ncard .nst.ok i{background:var(--up)} .ncard .nst.err i{background:var(--down)}

/* ===== PA-22: bố cục & giao diện mới (theo clip mẫu) ===== */
body{background:var(--bg);padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 40px)}
body.resting{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 128px)}
.h1{font-size:27px}
.eyebrow{color:var(--muted);letter-spacing:.12em}
.link{color:var(--gold-hi)}
.card,.li,.tile,.pday,.ex,.restcard,.todo,.tcard,.banner{border-radius:var(--r-lg)}
.btn{background:var(--surface-2)}
.btn.gold{background:var(--gold);color:var(--gold-ink);box-shadow:0 8px 22px -12px rgb(var(--acc-rgb) / .8)}
.seg{background:var(--surface);padding:3px;border-radius:var(--r-sm)}
.seg button{min-height:36px;border-radius:10px}
.seg button[aria-pressed="true"]{background:var(--surface-3);color:var(--fg)}
.chips button[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink);border-color:transparent}
.toggle input:checked{background:var(--gold)}
.toggle input:checked::after{background:#fff}
.prog i{background:var(--grad)}
.badge.almost,.badge.deload{color:var(--almost);background:rgb(var(--warn-rgb) / .13)}

/* đầu trang: trong suốt, mờ nền, nút chuông việc cần làm */
.top{background:var(--top-bg);border-bottom:0}
.top .wrap{padding-block:10px 8px}
.avatar{color:var(--gold-hi);background:var(--pc,var(--gold-soft));box-shadow:inset 0 0 0 1px rgb(var(--acc-rgb) / .38)}
.avatar.pcol{color:#15110a;box-shadow:none}
.bell{position:relative;flex:none;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--surface);color:var(--fg-2)}
.bell .ico{width:20px;height:20px}
.bell .bd{position:absolute;top:4px;right:4px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--gold);color:var(--gold-ink);font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--bg)}

/* thanh tab dưới: phẳng toàn chiều ngang, vạch sáng trên tab đang mở, nút Tập tròn nổi ở giữa */
.nav{padding:0;pointer-events:auto}
.nav .bar{max-width:none;height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));padding:0 6px env(safe-area-inset-bottom,0px);border-radius:0;border:0;border-top:1px solid var(--line);box-shadow:none;
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr)) 84px repeat(2,minmax(0,1fr));align-items:stretch}
.nav button{border-radius:0;font-size:11px;gap:3px;color:var(--muted)}
.nav button .ico{width:23px;height:23px}
.nav button[aria-current="page"]{color:var(--gold-hi);background:none}
.nav button[aria-current="page"]:not(.fab)::before{content:"";position:absolute;top:0;left:50%;width:26px;height:3px;border-radius:0 0 3px 3px;background:var(--gold);box-shadow:0 0 12px rgb(var(--acc-rgb) / .85);transform:translateX(-50%)}
.nav button.fab{overflow:visible;justify-content:flex-end;padding-bottom:9px}
.nav .fabc{position:absolute;top:-24px;left:50%;width:62px;height:62px;margin-left:-31px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:var(--gold-ink);background:var(--gold);box-shadow:0 0 0 5px var(--bg),0 8px 22px -4px rgb(var(--acc-rgb) / .6);transition:transform .2s}
.nav .fabc .ico{width:28px;height:28px;stroke-width:2}
.nav button.fab:active .fabc{transform:scale(.92)}
.nav button.fab .lb{font-weight:700;color:var(--fg)}
.nav button.fab[aria-current="page"] .lb{color:var(--gold-hi)}
.nav .dot{top:6px;left:calc(50% + 7px)}
.nav button.fab .dot{top:-22px;left:calc(50% + 17px);width:12px;height:12px;box-shadow:0 0 0 2px var(--bg)}

/* thẻ vé: buổi hôm nay, tổng tạ */
.tix{border:1px solid var(--tix-line);background:var(--tix-bg);color:var(--tix-fg);padding:18px 18px 16px;box-shadow:0 14px 34px -18px rgb(var(--acc-rgb) / .55);
  -webkit-mask:radial-gradient(circle at 0 var(--cut,60%),transparent 9.5px,#000 10px) left/51% 100% no-repeat,radial-gradient(circle at 100% var(--cut,60%),transparent 9.5px,#000 10px) right/51% 100% no-repeat;
  mask:radial-gradient(circle at 0 var(--cut,60%),transparent 9.5px,#000 10px) left/51% 100% no-repeat,radial-gradient(circle at 100% var(--cut,60%),transparent 9.5px,#000 10px) right/51% 100% no-repeat}
.tix > *{position:relative;z-index:2}
.tix .eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.14em;padding:5px 11px;border-radius:var(--pill);border:1px solid rgba(255,214,150,.42);color:#f3d6a6;background:rgba(0,0,0,.18)}
:root[data-skin="gold"] .tix .eyebrow{color:var(--gold-hi);border-color:rgb(var(--acc-rgb) / .45)}
.tix .h1{color:var(--tix-fg);font-size:30px;margin-top:12px}
.tix .meta,.tix .why{color:var(--tix-fg-2)}
.tix .why b{color:var(--tix-fg)}
.tix ul{margin:14px 0 0;gap:7px}
.tix li span:first-child{color:var(--tix-fg-2)}
.tix li b{color:var(--tix-fg)}
.tix li b.up{color:#8ff0b7}
.tix .more{color:var(--tix-fg-2);opacity:.8}
.tix .warnline{color:#ffd28a}
.tix .meta.painl{color:#ffb4a8}
.tcut{border-top:1.5px dashed rgba(255,214,150,.32);margin:16px -2px 14px}
.tfoot{display:flex;align-items:center;gap:12px}
.tfoot .why{flex:1;min-width:0;margin:0;font-size:12.5px}
.tgo{flex:none;min-height:50px;padding:0 20px;border:0;border-radius:15px;background:var(--tix-go);color:var(--tix-go-ink);font-size:16px;font-weight:800;box-shadow:0 8px 22px -10px rgba(0,0,0,.6)}
.tgo .ico{width:17px;height:17px;fill:currentColor;stroke:none}
.tix .big{font-size:46px;font-weight:800;letter-spacing:-.03em;line-height:1.05;background:var(--tix-num);-webkit-background-clip:text;background-clip:text;color:transparent}
.tix .unit{color:#f3d6a6;font-weight:800;letter-spacing:.12em;font-size:14px;margin-left:6px}
.tix .tstar{position:absolute;width:var(--s,10px);height:var(--s,10px);left:var(--x);top:var(--y);pointer-events:none;z-index:1;background:#fff3d6;clip-path:polygon(50% 0,63% 37%,100% 50%,63% 63%,50% 100%,37% 63%,0 50%,37% 37%);opacity:0;filter:drop-shadow(0 0 4px rgb(var(--acc-rgb)))}

/* chip chọn buổi */
.daychips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 14px;padding:0 16px 2px;touch-action:pan-x pan-y;overscroll-behavior-x:contain}
.daychips::-webkit-scrollbar{display:none}
.dchip{flex:none;display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 15px;border-radius:var(--pill);border:1px solid var(--line-2);background:transparent;color:var(--fg-2);font-size:14px;font-weight:600;white-space:nowrap}
.dchip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink);border-color:transparent}
.dchip .rd{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.dchip .rd.ok{background:var(--up)} .dchip .rd.mid{background:var(--almost)} .dchip .rd.low{background:var(--down)}
.dchip .tag{font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px;background:var(--gold);color:var(--gold-ink)}
.dchip.add .ico{width:16px;height:16px}

/* hai thẻ nhỏ cạnh nhau */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.mini{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:128px;padding:14px;text-align:left;color:inherit;font:inherit;min-width:0}
.mini .mic{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--gold-soft);color:var(--gold-hi);margin-bottom:8px}
.mini .mic .ico{width:17px;height:17px}
.mini .mic.up{background:rgb(var(--up-rgb) / .14);color:var(--up)}
.mini .ml{font-size:12.5px;color:var(--muted)}
.mini .mv{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.mini .mv small{font-size:13.5px;font-weight:600;color:var(--muted);margin-left:3px}
.mini .ms{margin-top:auto;padding-top:8px;font-size:12px;color:var(--fg-2);width:100%}
.mini .prog{width:100%;margin-top:auto}

/* việc cần làm: một thẻ lật ngang */
.todos{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;gap:10px;margin:0 -16px;padding:0 16px;touch-action:pan-x pan-y;overscroll-behavior-x:contain}
.todos::-webkit-scrollbar{display:none}
.todos > .tdi{flex:0 0 100%;scroll-snap-align:center;display:flex}
.todos > .tdi > *{flex:1;margin:0}
.tdots{display:flex;justify-content:center;gap:5px;margin:10px 0 2px}
.tdots i{width:6px;height:6px;border-radius:3px;background:var(--surface-3);transition:width .3s cubic-bezier(.2,1.2,.4,1),background .3s}
.tdots i.on{width:18px;background:var(--gold)}
.banner{border-color:var(--line);box-shadow:none}
.banner .bi{background:var(--gold-soft);color:var(--gold-hi)}
.banner.pain{border-color:rgb(var(--down-rgb) / .45);--beam-rgb:var(--down-rgb)}
.restcard .bi{background:rgb(var(--up-rgb) / .13);color:var(--up)}
.todo-sheet .banner,.todo-sheet .restcard{margin-bottom:10px}

/* viền ánh sáng chạy (bài đang tập, cảnh báo đau, việc cần duyệt) */
.beam{position:relative;isolation:isolate}
.beam::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1.5px;pointer-events:none;z-index:3;opacity:0;
  background:conic-gradient(from var(--ang),transparent 0 62%,rgb(var(--beam-rgb,var(--acc-hi-rgb)) / .0) 66%,rgb(var(--beam-rgb,var(--acc-hi-rgb))) 84%,#fff 88%,rgb(var(--beam-rgb,var(--acc-hi-rgb))) 91%,transparent 96%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
:root[data-anim="on"] .beam::before{opacity:1;animation:beamspin 3.4s linear infinite}
:root[data-anim="off"] .beam::before{opacity:.0}
@keyframes beamspin{to{--ang:360deg}}

/* chấm đỏ "đang tập", dải sáng qua đồng hồ */
.livedot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--down);margin-right:6px;vertical-align:1px}
.shine{background:linear-gradient(100deg,var(--fg) 0 38%,#fff 48%,var(--gold-hi) 52%,var(--fg) 62%);background-size:260% 100%;background-position:100% 0;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.shine small{-webkit-text-fill-color:var(--fg-2)}

/* buổi đang tập */
.sbar{background:linear-gradient(var(--bg) 82%,transparent);padding-block:4px 12px}
.sbar .eyebrow{color:var(--down);letter-spacing:.12em}
.elapsed{color:var(--fg);font-size:28px}
.ex{background:var(--surface)}
.ex.focus{position:relative;border:1px solid rgb(var(--acc-rgb) / .45);box-shadow:0 18px 40px -26px rgb(var(--acc-rgb) / .8)}
.target{background:var(--surface-2)}
.stepper{background:var(--surface-2);border-color:transparent;border-radius:13px}
.stepper input{height:50px;font-size:21px;font-weight:800}
.setrow.cur .stepper{background:var(--surface-3);box-shadow:inset 0 0 0 1.5px rgb(var(--acc-rgb) / .55)}
.setrow.done .stepper{background:transparent;border-color:var(--line)}
.check{width:48px;height:50px;border-radius:13px}
.fcue{border-radius:13px;border:0;border-left:0;background:rgb(var(--warn-rgb) / .09)}
.fcue1{border:0;border-radius:12px;background:rgb(var(--warn-rgb) / .09);padding:10px 12px}
.exnav button.cur{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.rest{padding-inline:12px;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 14px)}
.rest-in{background:color-mix(in srgb,var(--surface-2) 94%,transparent);color:var(--fg);border:1px solid var(--line-2);box-shadow:0 14px 34px -10px rgba(0,0,0,.7);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:10px 12px 12px 16px}
.rest-l{color:var(--muted);opacity:1}
.rest button{background:var(--surface-3);color:var(--fg);border:1px solid var(--line-2);min-height:38px}
.rest button[data-act="rest-skip"]{background:var(--gold);color:var(--gold-ink);border-color:transparent}
.rest-bar{height:3px;background:var(--grad)}

/* Lịch tập */
.wkcard{margin-bottom:12px}
.wkc-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.wkc-h b{font-size:15.5px}
.dots i{background:transparent;color:var(--fg);font-size:15px;width:34px;height:34px}
.dots .on i{background:rgb(var(--up-rgb) / .16);color:var(--up)}
.dots .today i{box-shadow:inset 0 0 0 1.5px var(--gold);color:var(--gold-hi)}
.dots .on.today i{background:rgb(var(--up-rgb) / .16)}
.pday::after{display:none}

/* Tiến độ: chia mục Sức mạnh / Cơ thể / Ảnh */
.ptabs{margin-bottom:14px}
.tix.ton{--cut:66%;margin-bottom:16px}
.tix.ton .tfoot .why{font-size:13px}

/* Tài khoản */
.acc-prof{padding:16px 16px 0;margin-bottom:10px;overflow:hidden}
.ap-top{display:flex;align-items:center;gap:14px;padding-bottom:16px}
.ap-top .avatar{width:56px;height:56px;font-size:19px}
.ap-top .t{flex:1;min-width:0}
.ap-top b{display:block;font-size:19px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ap-top span{font-size:12.5px;color:var(--muted)}
.ap-stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);margin:0 -16px}
.ap-stats div{padding:12px 4px;text-align:center;min-width:0}
.ap-stats div + div{border-left:1px solid var(--line)}
.ap-stats b{display:block;font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.ap-stats span{font-size:11.5px;color:var(--muted)}
.gh{font-size:11.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);margin:22px 4px 8px}
.grp{padding:0;overflow:hidden}
.grow{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;border:0;background:none;color:inherit;font:inherit;text-align:left}
.grow + .grow{border-top:1px solid var(--line)}
.grow .gi{flex:none;width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface-2);color:var(--fg-2)}
.grow .gi .ico{width:18px;height:18px}
.grow .gi.ok{color:var(--up)} .grow .gi.acc{background:var(--gold-soft);color:var(--gold-hi)} .grow .gi.bad{color:var(--down)}
.grow .gt{flex:1;min-width:0}
.grow .gt b{display:block;font-size:15px;font-weight:600}
.grow .gt span{display:block;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grow .ico.chev{width:18px;height:18px;color:var(--muted)}
.grow:active{background:var(--surface-2)}
.subhead{display:flex;flex-direction:column;align-items:flex-start;gap:6px;margin-bottom:14px}
.subhead .btn{padding-left:6px}
.subhead + .card:not(.acc) > h3:first-child{display:none}
.subhead + .card:not(.acc) > h3:first-child + p{margin-top:0}
.coachcard{display:block;width:100%;text-align:left;color:inherit;font:inherit}
.coachcard h3{margin:0}

/* chọn giao diện */
.skins{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.skin{border:1.5px solid var(--line-2);border-radius:14px;padding:10px;background:var(--surface-2);text-align:left;color:var(--fg);display:flex;flex-direction:column;gap:2px;min-width:0}
.skin[aria-pressed="true"]{border-color:var(--gold)}
.skin .sw{height:46px;border-radius:9px;background:var(--sb);border:1px solid rgba(255,255,255,.08);display:flex;align-items:flex-end;gap:5px;padding:7px;margin-bottom:8px}
.skin .sw i{width:16px;height:16px;border-radius:50%;background:var(--sa)}
.skin .sw i + i{background:var(--sa2)}
.skin .sn{font-weight:700;font-size:14px}
.skin .sd{font-size:11.5px;color:var(--muted);line-height:1.35}

/* chuyển động (chỉ khi bật hiệu ứng) */
:root[data-anim="on"] .tix .tstar{animation:twk2 var(--t,2.6s) ease-in-out var(--d,0s) infinite}
@keyframes twk2{0%,100%{opacity:0;transform:scale(.2) rotate(0)}45%{opacity:1;transform:scale(1) rotate(45deg)}60%{opacity:.85;transform:scale(.8) rotate(60deg)}}
:root[data-anim="on"] .shine{animation:shine 3.6s ease-in-out infinite}
@keyframes shine{0%,35%{background-position:100% 0}75%,100%{background-position:0 0}}
:root[data-anim="on"] .livedot{animation:livep 1.6s ease-out infinite}
@keyframes livep{0%{box-shadow:0 0 0 0 rgb(var(--down-rgb) / .6)}70%{box-shadow:0 0 0 7px rgb(var(--down-rgb) / 0)}100%{box-shadow:0 0 0 0 rgb(var(--down-rgb) / 0)}}
:root[data-anim="on"] .nav .fabc{animation:fabglow 2.6s ease-in-out infinite}
@keyframes fabglow{0%,100%{box-shadow:0 0 0 5px var(--bg),0 8px 18px -4px rgb(var(--acc-rgb) / .45)}50%{box-shadow:0 0 0 5px var(--bg),0 8px 30px 0 rgb(var(--acc-rgb) / .75)}}
:root[data-anim="on"] .prog i{background-size:200% 100%;animation:flow 4s linear infinite}
@keyframes flow{to{background-position:-200% 0}}
@media (max-width:370px){.tix .h1{font-size:26px}.tfoot{flex-wrap:wrap}.tgo{width:100%}.mini .mv{font-size:23px}.stepper input{font-size:19px}}
body.ct-locked :is([data-act="body-add"]:not(.btile), [data-act="sex"], label[for="bp-in"], .bc.add, [data-act="bp-edit"], [data-act="bp-del"], .bhist .sec-head .small, .bhist .li > .ls:last-child, .bnow-h .link, .bsex) { display: none !important; }  /* BR-37.5 */
body.ct-locked :is(.btile, .bhist .li) { pointer-events: none; }
body.plan-locked :is([data-act="add-day"], [data-act="rename-day"], [data-act="del-day"], [data-act="move-day"], [data-act="move-ex"], [data-act="add-ex"], [data-act="add-alt"], [data-act="make-main"], [data-act="rot-open"], [data-act="rot-hold"], [data-act="rot-swap"], [data-act="onb-sample"], [data-act="onb-new"], [data-act="prof-copy"], [data-act="lib-open"], [data-act="other-open"]) { display: none !important; }  /* BR-35.3 */

/* ---------- lưu trữ: máy này (IndexedDB) ---------- */
const LDB = {
  db: null, mem: { kv: {}, photos: {} },
  async open() {
    try {
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('so-ta', 1);
        r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('kv'); d.createObjectStore('photos'); };
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
      });
    } catch (e) { this.db = null; }
    try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  },
  req(store, mode, fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, mode); const q = fn(t.objectStore(store));
      t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error);
    });
  },
  async get(store, key) { if (this.db) { try { return await this.req(store, 'readonly', s => s.get(key)); } catch (e) {} } return this.mem[store][key]; },
  async put(store, key, val) { this.mem[store][key] = val; if (this.db) { try { await this.req(store, 'readwrite', s => s.put(val, key)); } catch (e) {} } },
  async del(store, key) { delete this.mem[store][key]; if (this.db) { try { await this.req(store, 'readwrite', s => s.delete(key)); } catch (e) {} } },
  async keys(store) { if (this.db) { try { return await this.req(store, 'readonly', s => s.getAllKeys()); } catch (e) {} } return Object.keys(this.mem[store]); },
  async clear(store) { this.mem[store] = {}; if (this.db) { try { await this.req(store, 'readwrite', s => s.clear()); } catch (e) {} } }
};
async function switchProfile(pid) {
  if (pid === profiles.active || !profiles.list.some(p => p.id === pid)) { closeSheet(); return; }
  clearTimeout(saveT); saveT = null;
  await LDB.put('kv', stateKey(profiles.active), clone(state));
  const g = globalsOf(state);
  profiles.active = pid; saveProfiles();
  const x = await LDB.get('kv', stateKey(pid));
  loadState(x && Array.isArray(x.days) ? x : freshState());
  Object.assign(state.settings, g);
  if (!state.settings.name) state.settings.name = curProf().name;
  ui.pick = null; ui.openDay = null; ui.draft = null; ui.progEx = null;
  closeSheet(); if (state.active) ui.tab = 'today'; render(); toast(`Đang xem: ${curProf().name}`);
}

function profStats(st) {

  const sets = ws.reduce((a, x) => a + x.entries.reduce((b, e) => b + e.sets.length + (e.drop ? 1 : 0), 0), 0);
  const last = S.reduce((a, b) => !a || b.startedAt > a.startedAt ? b : a, null);

}

    return m || null; };
