<!doctype html>
<html lang="vi" data-pwa="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sổ Tạ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Sổ Tạ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: app một cột kiểu super-app — thẻ hero vàng cho buổi tiếp theo, thẻ bo tròn lớn, thanh tab nổi dưới đáy. Một giao diện tối duy nhất: đen than + vàng gold. */
:root{
  --bg:#0a0a0b; --surface:#151517; --surface-2:#1d1d21; --surface-3:#27272c; --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.12);
  --fg:#f6f3ec; --fg-2:#bdb7aa; --muted:#827d72;
  --gold:#d9b45b; --gold-hi:#f2d68d; --gold-lo:#b8862f; --gold-ink:#1b1406; --gold-soft:rgba(217,180,91,.14);
  --up:#46d38f; --hold:#93b6ff; --down:#ff7470; --almost:#f2d68d;
  --font:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r-lg:22px; --r:16px; --r-sm:12px; --nav-h:68px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5;margin:0;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 32px);-webkit-tap-highlight-color:transparent}
body.resting{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 120px)}
button,input,select,textarea{font:inherit;color:inherit}
button,label[for]{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tn{font-variant-numeric:tabular-nums}
.ico .d{fill:none}
.nav button[aria-current="page"] .ico .d{fill:currentColor;fill-opacity:.22}
.muted{color:var(--muted)} .small{font-size:13px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(10,10,11,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.avatar{width:40px;height:40px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;
  color:var(--gold-ink);background:linear-gradient(140deg,var(--gold-hi),var(--gold-lo))}
.hello{min-width:0;flex:1}
.hello b{display:block;font-size:16px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hello span{font-size:12.5px;color:var(--muted)}
.cycle{font-size:12px;font-weight:700;color:var(--gold);background:var(--gold-soft);border:1px solid rgba(217,180,91,.28);padding:6px 11px;border-radius:999px;white-space:nowrap}
.cycle.deload{color:var(--gold-ink);background:var(--gold)}

/* type */
main{padding-block:18px}
.sec{margin-bottom:28px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.h{font-size:19px;font-weight:700;margin:0;letter-spacing:-.01em;text-wrap:balance}
.h1{font-size:28px;font-weight:800;margin:0;line-height:1.15;letter-spacing:-.02em;text-wrap:balance}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--gold)}
.sub{color:var(--fg-2);margin:6px 0 0}
.link{border:0;background:none;color:var(--gold);font-weight:600;font-size:14px;padding:4px 0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 18px;border-radius:14px;border:1px solid var(--line-2);
  background:var(--surface-2);font-weight:600;font-size:14.5px;color:var(--fg);text-decoration:none;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.gold{border:0;color:var(--gold-ink);background:linear-gradient(135deg,var(--gold-hi),var(--gold) 55%,var(--gold-lo));box-shadow:0 8px 24px -10px rgba(217,180,91,.6)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:4px 14px;font-size:13.5px;border-radius:12px}
.btn.big{min-height:54px;font-size:16px;width:100%;border-radius:16px}
.btn.danger{color:var(--down)}
.btn.danger-fill{background:var(--down);color:#1a0505;border:0}
.btn:disabled{opacity:.4;cursor:default}
.btn .ico{width:19px;height:19px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.empty{border:1.5px dashed var(--line-2);border-radius:var(--r);padding:18px;color:var(--fg-2);font-size:14px}

/* chips & badges */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:4px 9px;border-radius:999px;background:var(--surface-3);color:var(--fg-2);white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;letter-spacing:.04em;padding:4px 9px;border-radius:999px;white-space:nowrap}
.badge.up{color:var(--up);background:rgba(70,211,143,.13)}
.badge.almost,.badge.deload{color:var(--gold-hi);background:var(--gold-soft)}
.badge.hold,.badge.start{color:var(--hold);background:rgba(147,182,255,.13)}
.badge.down{color:var(--down);background:rgba(255,116,112,.13)}
.badge.new{color:var(--fg-2);background:var(--surface-3)}

/* banners */
.banner{display:flex;gap:12px;padding:14px;border-radius:var(--r);margin-bottom:16px;background:var(--surface);border:1px solid rgba(217,180,91,.3)}
.banner .bi{width:36px;height:36px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--gold-soft);color:var(--gold);font-weight:800}
.banner.info{border-color:rgba(147,182,255,.28)} .banner.info .bi{background:rgba(147,182,255,.13);color:var(--hold)}
.banner b{display:block;font-size:14.5px}
.banner p{margin:2px 0 10px;color:var(--fg-2);font-size:13.5px}
.banner p:last-child{margin-bottom:0}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:20px 18px 18px;margin-bottom:22px;border:1px solid rgba(217,180,91,.32);
  background:radial-gradient(130% 120% at 100% 0%,rgba(242,214,141,.30),rgba(217,180,91,.08) 45%,transparent 70%),linear-gradient(180deg,#1b1812,#121213)}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;border:22px solid rgba(217,180,91,.10);pointer-events:none}
.hero .h1{margin-top:6px;font-size:30px}
.hero .meta{color:var(--fg-2);font-size:13.5px;margin-top:4px}
.hero ul{list-style:none;margin:16px 0 18px;padding:0;display:flex;flex-direction:column;gap:8px}
.hero li{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px}
.hero li span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg-2)}
.hero li b{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.hero li b.up{color:var(--up)}
.hero .more{font-size:12.5px;color:var(--muted)}

/* day scroller */
.hscroll{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.dcard{scroll-snap-align:start;flex:0 0 152px;text-align:left;display:flex;flex-direction:column;gap:3px;padding:14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);min-height:118px}
.dcard b{font-size:16.5px;font-weight:700;line-height:1.25}
.dcard span{font-size:12.5px;color:var(--fg-2)}
.dcard .last{margin-top:auto;color:var(--muted);font-size:12px}

/* week mini */
.wk{display:flex;flex-direction:column;gap:14px}
.dots{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dots div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--muted)}
.dots i{width:30px;height:30px;border-radius:50%;background:var(--surface-3);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;font-weight:700;color:var(--fg-2)}
.dots .on i{background:linear-gradient(140deg,var(--gold-hi),var(--gold-lo));color:var(--gold-ink)}
.dots .today i{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--gold)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{padding:12px;border-radius:14px;background:var(--surface-2)}
.kpi .k{font-size:24px;font-weight:800;line-height:1.1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--fg-2)}

/* lists */
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);width:100%;text-align:left}
.li .lt{font-weight:600;font-size:14.5px;display:block;min-width:0;overflow-wrap:anywhere}
.li .ls{font-size:12.5px;color:var(--muted)}
.li .lr{text-align:right;flex:none}
.li .big{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.arrow{color:var(--up);font-weight:700}
.delta{font-size:12px;font-weight:600}
.delta.good{color:var(--up)} .delta.flat{color:var(--muted)} .delta.other{color:var(--fg-2)}

/* session */
.sbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 61px);z-index:15;background:var(--bg);padding-block:6px 12px;margin-bottom:6px}
.sbar-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.elapsed{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--gold)}
.prog{height:6px;border-radius:3px;background:var(--surface-3);margin-top:10px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold-lo),var(--gold-hi));border-radius:3px;transition:width .25s}
.prog-l{font-size:12px;color:var(--muted);margin-top:5px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);margin-bottom:14px;overflow:hidden}
.ex-photo{position:relative;display:block;width:100%;aspect-ratio:16/8;max-width:100%;background:var(--surface-2)}
.ex-photo img{width:100%;height:100%;object-fit:cover;display:block}
.ex-photo .cnt{position:absolute;left:12px;bottom:10px;font-size:11.5px;font-weight:600;background:rgba(0,0,0,.6);padding:3px 8px;border-radius:999px}
.camfab{position:absolute;right:10px;bottom:10px;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(10,10,11,.72);color:var(--gold);border:1px solid rgba(217,180,91,.4)}
.camfab .ico{width:20px;height:20px}
.cam-empty{display:flex;align-items:center;gap:12px;margin:14px 14px 0;padding:12px;border-radius:14px;border:1.5px dashed rgba(217,180,91,.35);color:var(--fg-2);font-size:13px;background:rgba(217,180,91,.04)}
.cam-empty .ci{width:42px;height:42px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--gold-soft);color:var(--gold)}
.cam-empty b{display:block;color:var(--fg);font-size:14px}
.ex-body{padding:14px}
.ex-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.ex-name{font-weight:700;font-size:17px;line-height:1.3;min-width:0;overflow-wrap:anywhere}
.ex-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.target{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--surface-2)}
.target .tl{font-size:12px;color:var(--fg-2)}
.target .tv{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums}
.target .tv small{font-size:14px;font-weight:600;color:var(--fg-2)}
.target .tv.up{color:var(--up)}
.target .prev{text-align:right;font-size:12px;color:var(--muted)}
.target .prev b{display:block;font-size:14px;color:var(--fg-2);font-weight:600}
.sug{margin:10px 0 0;font-size:13.5px;color:var(--fg-2)}
.sug strong{color:var(--fg)}
details.setup{margin-top:10px;font-size:13.5px}
details.setup summary{color:var(--gold);font-weight:600;list-style:none}
details.setup summary::-webkit-details-marker{display:none}
details.setup p{margin:6px 0 0;white-space:pre-wrap;color:var(--fg-2)}
.sets{margin-top:14px;display:flex;flex-direction:column;gap:7px}
.sethead,.setrow{display:grid;grid-template-columns:24px 1fr 1fr 46px;gap:8px;align-items:center}
.sethead{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sethead span:nth-child(2),.sethead span:nth-child(3){text-align:center}
.setno{font-weight:800;font-size:15px;color:var(--muted);text-align:center}
.setrow.drop .setno{color:var(--gold)}
.stepper{display:flex;align-items:stretch;border-radius:13px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;min-width:0;transition:background .15s}
.stepper button{width:34px;border:0;background:transparent;font-size:20px;color:var(--fg-2);flex:none}
.stepper button:active{background:var(--surface-3)}
.stepper input{width:100%;min-width:0;border:0;background:transparent;text-align:center;font-weight:700;font-size:19px;font-variant-numeric:tabular-nums;height:46px;padding:0}
.stepper input:focus{outline:none;background:var(--surface-3)}
.setrow.done .stepper{background:rgba(70,211,143,.08);border-color:rgba(70,211,143,.25)}
.check{width:46px;height:46px;border-radius:14px;border:1.5px solid var(--line-2);background:transparent;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.check[aria-pressed="true"]{background:var(--up);border-color:var(--up);color:#06170e}
.check .ico{stroke-width:2.6}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.note{width:100%;margin-top:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);padding:10px 12px;font-size:14px;resize:vertical;min-height:44px;color:var(--fg)}
.note::placeholder,.inp::placeholder{color:var(--muted)}
.sess-actions{display:flex;flex-direction:column;gap:8px;margin-top:20px}

/* plan */
.pday{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);margin-bottom:12px;overflow:hidden}
.pday-h{display:flex;align-items:center;gap:12px;padding:16px;width:100%;border:0;background:transparent;text-align:left}
.pday-h .t{flex:1;min-width:0}
.pday-h b{display:block;font-size:18px;font-weight:700}
.pday-h span{font-size:13px;color:var(--fg-2)}
.chev{color:var(--muted);transition:transform .2s}
.pday.open .chev{transform:rotate(90deg)}
.exl{list-style:none;margin:0;padding:0 16px}
.exr{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding-block:10px}
.exr-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;border:0;background:transparent;text-align:left;padding:0}
.exr-main .t{min-width:0;flex:1}
.exr-main .n{display:block;font-weight:600;font-size:14.5px;line-height:1.3;overflow-wrap:anywhere}
.exr-main .m{font-size:12px;color:var(--muted)}
.exr-kg{text-align:right;flex:none}
.exr-kg b{display:block;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.exr-kg span{font-size:11.5px;color:var(--up);font-weight:600;white-space:nowrap}
.exr-kg span.none{color:var(--gold)}
.thumb{width:48px;height:48px;border-radius:13px;object-fit:cover;background:var(--surface-3);display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
img.thumb{display:block}
.thumb .ico{width:22px;height:22px}
.mv{display:flex;flex-direction:column;gap:3px}
.mv button{width:30px;height:24px;border-radius:7px;border:1px solid var(--line);background:transparent;color:var(--fg-2);padding:0;display:flex;align-items:center;justify-content:center}
.mv .ico{width:16px;height:16px}
.pday-a .btn .ico{width:17px;height:17px}
.mv button:disabled{opacity:.3}
.pday-a{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px 16px;border-top:1px solid var(--line)}

/* progress tab */
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.weeknav .btn{width:44px;padding:0}
.weeknav .wl{font-size:19px;font-weight:700;text-align:center}
.vol{display:flex;flex-direction:column;gap:12px}
.vrow{display:grid;grid-template-columns:84px 1fr 56px;gap:10px;align-items:center}
.vrow .vn{font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vtrack{position:relative;height:12px;border-radius:6px;background:var(--surface-3)}
.vband{position:absolute;top:0;bottom:0;background:rgba(217,180,91,.16);border-left:1.5px solid rgba(217,180,91,.55);border-right:1.5px solid rgba(217,180,91,.55)}
.vfill{position:absolute;left:0;top:3px;bottom:3px;border-radius:0 4px 4px 0;background:var(--fg-2)}
.vrow .vv{font-size:16px;font-weight:800;text-align:right;font-variant-numeric:tabular-nums;line-height:1.1}
.vrow .vv small{display:block;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.st-low{color:var(--gold-hi)} .st-ok{color:var(--up)} .st-high{color:var(--hold)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:12px}
.legend i{display:inline-block;width:18px;height:9px;border-radius:3px;vertical-align:middle;margin-right:6px;background:rgba(217,180,91,.16);border:1.5px solid rgba(217,180,91,.55)}

/* body */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:18px}
.tile{padding:13px 14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.tile .tl{font-size:12px;font-weight:600;color:var(--fg-2)}
.tile .tv{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.2;font-variant-numeric:tabular-nums}
.tile .tv small{font-size:13px;font-weight:600;color:var(--fg-2);margin-left:3px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;color:var(--fg-2)}
.chips button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.chart{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:10px 6px 4px;margin-bottom:18px;touch-action:pan-y}
.sheet-panel .chart{background:var(--surface-2)}
.chart svg{display:block;width:100%}
.chart .ctitle{font-size:13px;font-weight:600;color:var(--fg-2);padding:2px 10px 0}
.chart .tip{position:absolute;pointer-events:none;background:var(--fg);color:var(--bg);font-size:12px;padding:5px 9px;border-radius:9px;white-space:nowrap;transform:translate(-50%,-100%)}
.chart .tip b{font-size:14px}
.chart .nodata{padding:28px 12px;text-align:center;color:var(--muted);font-size:14px}

/* roadmap */
.road{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.road::-webkit-scrollbar{display:none}
.road div{flex:0 0 auto;min-width:78px;padding:10px 12px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line)}
.sheet-panel .road div{background:var(--surface-3)}
.road div.now{border-color:var(--gold);background:var(--gold-soft)}
.road div.dl{border-style:dashed;border-color:var(--line-2)}
.road span{display:block;font-size:11px;font-weight:600;color:var(--muted);white-space:nowrap}
.road b{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.road div.hit b{color:var(--up)}
.eta{font-size:13.5px;color:var(--fg-2);margin:10px 0 0}
.eta b{color:var(--fg)}

/* forms */
.fsec{margin-top:20px}
.fsec > .eyebrow{display:block;margin-bottom:10px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--fg-2);min-width:0}
label.f.full,.full{grid-column:1/-1}
.inp{width:100%;min-height:48px;border:1px solid var(--line-2);border-radius:13px;background:var(--surface-2);padding:10px 12px;font-size:16px;color:var(--fg);font-weight:500}
.inp:focus{outline:none;border-color:var(--gold)}
select.inp{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 21px,calc(100% - 13px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
textarea.inp{min-height:88px;resize:vertical}
.inp.kg{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.unit{font-weight:500;color:var(--muted)}
.fhint{font-size:12px;color:var(--muted);font-weight:400;margin:0}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;padding:0 4px;font-size:14.5px;font-weight:600}
.toggle input{appearance:none;-webkit-appearance:none;width:48px;height:28px;border-radius:999px;background:var(--surface-3);position:relative;transition:background .2s;flex:none;margin:0}
.toggle input::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:var(--fg-2);transition:transform .2s,background .2s}
.toggle input:checked{background:var(--gold)}
.toggle input:checked::after{transform:translateX(20px);background:var(--gold-ink)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line)}
.seg button{border:0;background:transparent;border-radius:10px;min-height:40px;font-size:13.5px;font-weight:600;color:var(--fg-2);padding:4px 6px}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink)}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.ph{position:relative}
.ph img{width:78px;height:78px;object-fit:cover;border-radius:13px;display:block;background:var(--surface-3)}
.ph button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:2px solid var(--surface);background:var(--fg);color:var(--bg);padding:0;display:flex;align-items:center;justify-content:center}
.ph button .ico{width:13px;height:13px;stroke-width:2.6}
.addph{width:78px;height:78px;border-radius:13px;border:1.5px dashed rgba(217,180,91,.45);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--gold);background:rgba(217,180,91,.05)}
.addph.lib{border-color:var(--line-2);color:var(--fg-2);background:transparent}
.qpick{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.qpick button{border:1px solid var(--line-2);background:var(--surface-2);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500}

/* me */
.set-card{margin-bottom:12px}
.set-card h3{font-size:16px;font-weight:700;margin:0 0 4px}
.set-card > p{margin:0 0 12px;color:var(--fg-2);font-size:13.5px}
.rules{font-size:13.5px;color:var(--fg-2)}
.rules h4{font-size:14px;color:var(--fg);margin:14px 0 4px}
.rules ul{margin:0;padding-left:18px}
.rules li{margin-bottom:4px}
.tbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.tbl th,.tbl td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tbl-wrap{overflow-x:auto}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:0 12px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.nav .bar{max-width:536px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h);padding:6px;border-radius:24px;pointer-events:auto;
  background:rgba(24,24,27,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line-2);box-shadow:0 12px 30px -12px rgba(0,0,0,.8)}
.nav button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;background:transparent;color:var(--muted);font-size:10.5px;font-weight:600;border-radius:18px}
.nav button[aria-current="page"]{color:var(--gold);background:var(--gold-soft)}
.nav .dot{position:absolute;top:8px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--down);box-shadow:0 0 0 2px #18181b}

/* rest */
.rest{position:fixed;left:0;right:0;z-index:29;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 16px);padding-inline:12px}
.rest-in{position:relative;overflow:hidden;max-width:536px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:12px 14px 14px;border-radius:20px;
  background:linear-gradient(135deg,var(--gold-hi),var(--gold) 60%,var(--gold-lo));color:var(--gold-ink);box-shadow:0 12px 30px -10px rgba(217,180,91,.55)}
.rest-bar{position:absolute;left:0;bottom:0;height:4px;width:100%;background:rgba(27,20,6,.55);transform-origin:left}
.rest-l{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.rest-t{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.02em}
.rest button{border:0;background:rgba(27,20,6,.14);color:var(--gold-ink);border-radius:11px;padding:8px 12px;font-size:13px;font-weight:700}
.rest .sp{margin-left:auto}

/* sheet */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.66)}
.sheet-panel{position:relative;width:100%;max-width:560px;max-height:93vh;max-height:93dvh;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);
  border-radius:26px 26px 0 0;border-top:1px solid var(--line-2);padding:10px 16px calc(22px + env(safe-area-inset-bottom,0px))}
.sheet-panel .inp{background:var(--surface-2)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--surface-3);margin:0 auto 14px}
.sh-title{font-size:22px;font-weight:800;margin:0 0 4px;line-height:1.2;letter-spacing:-.01em;text-wrap:balance}
.sh-text{color:var(--fg-2);margin:0 0 14px;font-size:14px}
.sh-actions{display:flex;flex-direction:column;gap:8px;margin-top:20px}
.pr{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;word-break:break-all}

/* viewer */
.viewer{position:fixed;inset:0;z-index:60;background:#000;display:flex;flex-direction:column;color:#f6f3ec;
  padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.viewer .vtop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.viewer .vtop b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.viewer button,.viewer label{border:1px solid rgba(255,255,255,.22);background:transparent;color:#f6f3ec;border-radius:12px;min-height:40px;padding:6px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.viewer label{color:#d9b45b;border-color:rgba(217,180,91,.45)}
.viewer .vimg{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding-block:12px}
.viewer .vimg img{max-height:100%;max-width:100%;object-fit:contain;border-radius:12px}
.viewer .vcap{white-space:pre-wrap;font-size:14px;color:#cfc9bd;max-height:26vh;overflow:auto;background:#141416;border-radius:14px;padding:12px}
.viewer .vnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 100px);z-index:70;
  background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:14px;font-size:14px;font-weight:600;width:max-content;max-width:calc(100% - 32px);text-align:center;box-shadow:0 10px 30px -10px rgba(0,0,0,.8)}
/* sync */
.sync-h{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.sync-h h3{margin:0}
.sync-dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
.sync.ok .sync-dot{background:var(--up);box-shadow:0 0 0 4px rgba(70,211,143,.15)}
.sync.warn{border-color:rgba(217,180,91,.35)} .sync.warn .sync-dot{background:var(--gold)}
/* warm-up */
.warm{margin-top:12px;padding:10px 12px;border-radius:14px;border:1px dashed var(--line-2)}
.warm-h{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--gold)}
.warm-h .ico{width:16px;height:16px}
.warm-h span{font-weight:500;color:var(--muted);margin-left:auto;font-size:12px}
.warm-sets{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.warm-sets button{border:1px solid var(--line-2);background:var(--surface-2);border-radius:10px;padding:6px 10px;font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--fg)}
.warm-sets button small{font-weight:500;color:var(--muted);margin-left:2px}
.warm-sets button[aria-pressed="true"]{background:rgba(70,211,143,.12);border-color:rgba(70,211,143,.35);color:var(--up)}
/* body photos */
.bp-strip{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-bottom:14px}
.bp-strip::-webkit-scrollbar{display:none}
.bp-strip button{flex:0 0 auto;width:86px;border:0;padding:0;background:none;text-align:left;color:var(--fg-2);display:flex;flex-direction:column;gap:4px}
.bp-strip img{width:86px;height:114px;object-fit:cover;border-radius:12px;display:block;background:var(--surface-3)}
.bp-strip span{font-size:11.5px;font-weight:600}
.cmp-sel{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.cmp-sel .inp{min-height:42px;font-size:14px}
.cmp{position:relative;aspect-ratio:3/4;max-width:100%;border-radius:18px;overflow:hidden;background:var(--surface-2);user-select:none;-webkit-user-select:none;touch-action:pan-y}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.cmp .handle{position:absolute;top:0;bottom:0;left:50%;width:2px;background:var(--gold);transform:translateX(-1px);pointer-events:none}
.cmp .handle i{position:absolute;top:50%;left:50%;width:36px;height:36px;border-radius:50%;transform:translate(-50%,-50%);background:var(--gold);color:var(--gold-ink);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.5)}
.cmp .handle .ico{width:18px;height:18px;stroke-width:2.2}
.cmp .tag{position:absolute;top:10px;font-size:12px;font-weight:700;background:rgba(0,0,0,.65);padding:4px 9px;border-radius:999px;color:#f6f3ec}
.cmp .tag.l{left:10px} .cmp .tag.r{right:10px;color:var(--gold-hi)}
.cmp-range{width:100%;margin:12px 0 0;accent-color:var(--gold)}
.note-line{font-size:12.5px;color:var(--muted);margin:10px 0 0}
/* schedule */
.sched{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.sched label{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--fg-2)}
.sched select{width:100%;min-height:58px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--fg);font-size:11px;font-weight:600;padding:4px 2px;text-align:center;text-align-last:center;appearance:none;-webkit-appearance:none;white-space:normal}
.sched select.on{border-color:var(--gold);background:var(--gold-soft);color:var(--gold-hi)}
.dots .plan i{box-shadow:inset 0 0 0 1.5px var(--gold);background:transparent;color:var(--gold)}
.miss{color:var(--gold);font-weight:600}
.restcard{display:flex;align-items:center;gap:12px;padding:14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);margin-bottom:14px;font-size:14px;color:var(--fg-2)}
.restcard .bi{width:36px;height:36px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;background:rgba(147,182,255,.13);color:var(--hold)}
.restcard b{display:block;color:var(--fg);font-size:14.5px}
.viewer .vdel{color:#ff7470;border-color:rgba(255,116,112,.4)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:360px){.stepper button{width:28px}.sethead,.setrow{grid-template-columns:18px 1fr 1fr 44px;gap:6px}.check{width:44px}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="avatar" id="avatar" aria-hidden="true">ST</div>
    <div class="hello"><b id="hello">Sổ Tạ</b><span id="today-l"></span></div>
    <div id="cycle"></div>
  </div>
</header>

<main class="wrap" id="view"></main>

<div class="rest" id="rest" hidden>
  <div class="rest-in" role="timer" aria-live="polite">
    <div><div class="rest-l" id="rest-l">Nghỉ</div><div class="rest-t" id="rest-t">0:00</div></div>
    <span class="sp"></span>
    <button type="button" data-act="rest-add">+15s</button>
    <button type="button" data-act="rest-skip">Bỏ qua</button>
    <span class="rest-bar" id="rest-bar"></span>
  </div>
</div>

<nav class="nav" aria-label="Điều hướng">
  <div class="bar">
    <button type="button" data-act="tab" data-tab="today"><svg class="ico" viewBox="0 0 24 24"><rect class="d" x="5" y="6.5" width="3.4" height="11" rx="1.4"/><rect class="d" x="15.6" y="6.5" width="3.4" height="11" rx="1.4"/><path d="M2.6 9.8v4.4M21.4 9.8v4.4M8.4 12h7.2"/></svg>Tập<span class="dot" id="dot-active" hidden></span></button>
    <button type="button" data-act="tab" data-tab="plan"><svg class="ico" viewBox="0 0 24 24"><rect class="d" x="4.5" y="3.5" width="15" height="17" rx="3.2"/><path d="M8.5 8.5h7M8.5 12h7M8.5 15.5h4.2"/></svg>Giáo án</button>
    <button type="button" data-act="tab" data-tab="week"><svg class="ico" viewBox="0 0 24 24"><path class="d" d="M3.5 20V16l5-5 4 3.5 8-7.5v13z" stroke="none"/><path d="M3.5 16l5-5 4 3.5 8-7.5"/><path d="M15.5 7h5v5"/></svg>Tiến độ</button>
    <button type="button" data-act="tab" data-tab="body"><svg class="ico" viewBox="0 0 24 24"><path class="d" d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.2a4.3 4.3 0 0 1 7.5 2.6C19.5 15.4 12 20 12 20z"/><path d="M7.2 12.4h2.4l1.3-2.2 2 4.4 1.3-2.2h2.6"/></svg>Cơ thể</button>
    <button type="button" data-act="tab" data-tab="more"><svg class="ico" viewBox="0 0 24 24"><circle class="d" cx="12" cy="8.5" r="4"/><path d="M4.5 20.5c.9-3.8 3.9-6 7.5-6s6.6 2.2 7.5 6"/></svg>Tôi</button>
  </div>
</nav>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-bg" data-act="close-sheet"></div>
  <div class="sheet-panel" id="sheet-body" role="dialog" aria-modal="true"></div>
</div>
<div class="viewer" id="viewer" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
'use strict';

/* ---------- tiện ích ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');
const ymd = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const dm = s => { const d = parseYmd(s); return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}`; };
const DOW = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];
const DOWL = ['Chủ nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
const num = v => { if (v === '' || v == null) return null; const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : null; };
const r2 = v => Math.round(v * 100) / 100;
const fmt = (v, dec = 1) => v == null || v === '' ? '–' : Number(r2(v)).toLocaleString('vi-VN', { maximumFractionDigits: dec });
const fmtIn = v => v == null || v === '' ? '' : String(r2(v)).replace('.', ',');
const daysBetween = (a, b) => Math.round((parseYmd(b) - parseYmd(a)) / 86400000);
const fmtDur = ms => { const s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return h ? `${h}:${pad(m)}:${pad(x)}` : `${m}:${pad(x)}`; };
const ago = d => { const n = daysBetween(d, ymd()); return n <= 0 ? 'hôm nay' : n === 1 ? 'hôm qua' : `${n} ngày trước`; };
const e1rm = (kg, reps) => kg > 0 && reps > 0 ? kg * (1 + reps / 30) : 0;
const shortName = n => String(n).replace(/\s*\(.*\)\s*$/, '');

const IC = (body, cls = '') => `<svg class="ico ${cls}" viewBox="0 0 24 24" aria-hidden="true">${body}</svg>`;
const ICON = {
  check: IC('<path d="M5 12.5l4.5 4.5L19 7.5"/>'),
  cam: IC('<path d="M4 9a2 2 0 0 1 2-2h1.8l1.4-2.2h5.6L16.2 7H18a2 2 0 0 1 2 2v8.5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><circle cx="12" cy="12.8" r="3.3"/>'),
  img: IC('<rect x="3.5" y="4.5" width="17" height="15" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17.5l5-4.5 4 3.5 3-2.5 4.5 3.5"/>'),
  bolt: IC('<path d="M13 3L5 13.5h6L10 21l8-10.5h-6z"/>'),
  heart: IC('<path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.2a4.3 4.3 0 0 1 7.5 2.6C19.5 15.4 12 20 12 20z"/>'),
  chev: IC('<path d="M9 6l6 6-6 6"/>', 'chev'),
  chevL: IC('<path d="M15 6l-6 6 6 6"/>'),
  chevR: IC('<path d="M9 6l6 6-6 6"/>'),
  up: IC('<path d="M6 15l6-6 6 6"/>'),
  down: IC('<path d="M6 9l6 6 6-6"/>'),
  x: IC('<path d="M7 7l10 10M17 7L7 17"/>'),
  alert: IC('<path d="M12 4.5l8.5 15H3.5z"/><path d="M12 10v4.2M12 17v.2"/>'),
  flame: IC('<path d="M12 21c-3.9 0-6.5-2.6-6.5-6.1 0-3.4 2.4-5.3 3.6-7.7.4 1.8 1.3 2.9 2.4 3.5.2-2.8 1.3-5.3 3.4-7.2-.1 3 1.1 4.9 2.4 6.5 1 1.3 1.7 2.8 1.7 4.8 0 3.6-3 6.2-7 6.2z"/>'),
  bell: IC('<path d="M6.5 16.5V11a5.5 5.5 0 0 1 11 0v5.5l1.5 2h-14z"/><path d="M10 20.5a2 2 0 0 0 4 0"/>'),
  cal: IC('<rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/>'),
  moon: IC('<path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10z"/>'),
  swap: IC('<path d="M9 7l-4 5 4 5M15 7l4 5-4 5"/>'),
  play: '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor" stroke="none"/></svg>'

    let first = a; for (const h of H) { if (wt(h) === W) first = h; else break; }
    const gate = addDays(first.date, 6);

      text: `Tuần trước đạt đủ ${ex.sets}×${tgt} ở ${fmt(W)} kg. Tuần này lên <strong>${fmt(nextKg)} kg</strong> (+${fmt(nextKg - W)}); rep tụt 1–2 là bình thường.` };
    return { kind: 'almost', label: 'ĐÃ ĐẠT', kg: W, next: nextKg, reps: fill(tgt),
      text: `Đã đạt đủ rep ở ${fmt(W)} kg. Mỗi tuần chỉ tăng một lần: từ ${DOW[parseYmd(gate).getDay()]} ${dm(gate)} lên <strong>${fmt(nextKg)} kg</strong>.` };
  }
  if (ok(a)) return { kind: 'almost', label: 'SẮP TĂNG', kg: W, next: nextKg, reps: fill(tgt), text: `Đạt đủ rep 1 tuần. Đạt thêm 1 tuần ở <strong>${fmt(W)} kg</strong> là lên ${fmt(nextKg)} kg (tốc độ Thận trọng).` };
  if (c && wt(b) === W && wt(c) === W && !ok(b) && !ok(c) && repsAt(a, W) <= repsAt(c, W)) {
    const kg = roundStep(W * 0.9, ex.step);

  }

  return { kind: 'hold', label: 'GIỮ', kg: W, reps, text: `Giữ <strong>${fmt(W)} kg</strong>, cố đạt đủ ${ex.sets}×${tgt}. Đạt là tuần sau lên ${fmt(nextKg)} kg.` };
}

function roadmap(ex, weeks = 8) {
  const sg = suggest(ex);
  const base0 = sg.kind === 'deload' ? baseKg(ex) : sg.kg; if (base0 == null) return null;
  const pace = PACE[state.settings.pace] || PACE.std;
  const every = state.settings.deloadEvery || 6; const c = cycleInfo(); const w0 = c ? c.week : 1;
  const mon = weekDaysOf(0)[0];
  let base = base0, streak = sg.kind === 'almost' ? pace.need - 1 : 0, hitWeek = null;
  const out = [];
  const dl0 = sg.kind === 'deload';
  const isDl = i => i === 0 ? dl0 : dl0 ? i % (every + 1) === 0 : ((w0 + i - 1) % (every + 1)) + 1 === every + 1;
  for (let i = 0; i < 156; i++) {
    const dl = isDl(i);
    let kg;
    if (i === 0) kg = dl0 ? sg.kg : base;
    else if (dl) kg = roundStep(base * 0.9, ex.step);
    else {
      if (!isDl(i - 1)) { streak++; if (streak >= pace.need) { base = roundStep(base + incFor(ex, base), ex.step); streak = 0; } }
      kg = base;
    }
    if (ex.targetKg && hitWeek == null && !dl && kg >= ex.targetKg) hitWeek = i;
    if (i < weeks) out.push({ i, kg, dl, date: addDays(mon, i * 7) });
    if (i >= weeks - 1 && (!ex.targetKg || hitWeek != null)) break;
  }
  return { weeks: out, hitWeek, hitDate: hitWeek != null ? addDays(mon, hitWeek * 7) : null };
}

async function compressImage(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    let out = '';
    for (const [max, q] of [[1200, 0.74], [1100, 0.62], [960, 0.55], [800, 0.5], [640, 0.45]]) {
      const sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      out = c.toDataURL('image/jpeg', q);
      if (out.length < 230000) break;
    }
    return out;
  } finally { URL.revokeObjectURL(url); }
}

  for (const img of $$('img[data-photo]', root)) {

}

/* ---------- biểu đồ ---------- */
function niceNum(x) { const e = Math.floor(Math.log10(x)), f = x / Math.pow(10, e); return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * Math.pow(10, e); }
function drawLine(el, pts, o) {
  if (!el) return;
  if (pts.length < 2) { el.innerHTML = `<div class="ctitle">${esc(o.title)}</div><div class="nodata">Cần ít nhất 2 lần ghi để vẽ biểu đồ.</div>`; return; }
  const W = Math.max(260, el.clientWidth - 12), H = 210, L = 44, R = 18, T = 26, B = 28;
  const ys = pts.map(p => p.y); let lo = Math.min(...ys), hi = Math.max(...ys);
  if (hi - lo < 1e-9) { lo -= Math.max(1, Math.abs(lo) * 0.05); hi += Math.max(1, Math.abs(hi) * 0.05); }
  const step = niceNum((hi - lo) / 3); lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const ticks = []; for (let v = lo; v <= hi + step / 2; v += step) ticks.push(v);
  const t0 = pts[0].t, t1 = pts[pts.length - 1].t;
  const X = t => t1 === t0 ? L + (W - L - R) / 2 : L + (t - t0) / (t1 - t0) * (W - L - R);
  const Y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${X(p.t).toFixed(1)},${Y(p.y).toFixed(1)}`).join('');
  const area = `${line}L${X(t1).toFixed(1)},${Y(lo).toFixed(1)}L${X(t0).toFixed(1)},${Y(lo).toFixed(1)}Z`;
  const last = pts[pts.length - 1];
  const gid = 'g' + Math.random().toString(36).slice(2, 7);
  let s = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${esc(o.title)}"><defs><linearGradient id="${gid}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#d9b45b" stop-opacity=".28"/><stop offset="1" stop-color="#d9b45b" stop-opacity="0"/></linearGradient></defs>`;
  for (const v of ticks) s += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="rgba(255,255,255,.07)" stroke-width="1"/><text x="${L - 8}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="#827d72">${fmt(v, o.dec)}</text>`;
  s += `<text x="${L}" y="${H - 8}" font-size="11" fill="#827d72">${dm(pts[0].d)}</text><text x="${W - R}" y="${H - 8}" text-anchor="end" font-size="11" fill="#827d72">${dm(last.d)}</text>`;
  s += `<path d="${area}" fill="url(#${gid})"/><path d="${line}" fill="none" stroke="#d9b45b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  if (pts.length <= 40) for (const p of pts) s += `<circle cx="${X(p.t)}" cy="${Y(p.y)}" r="3.5" fill="#d9b45b" stroke="#151517" stroke-width="2"/>`;
  s += `<circle cx="${X(last.t)}" cy="${Y(last.y)}" r="5.5" fill="#f2d68d" stroke="#151517" stroke-width="2"/>`;
  s += `<text x="${Math.min(X(last.t), W - R)}" y="${Math.max(12, Y(last.y) - 12)}" text-anchor="end" font-size="13" font-weight="700" fill="#f6f3ec">${fmt(last.y, o.dec)}</text>`;
  s += `<line id="${gid}x" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="#bdb7aa" stroke-width="1" stroke-dasharray="3 3" visibility="hidden"/></svg>`;
  el.innerHTML = `<div class="ctitle">${esc(o.title)}</div>${s}<div class="tip" hidden></div>`;
  const svg = $('svg', el), tip = $('.tip', el), cx = $(`#${gid}x`, el);
  const move = e => {
    const r = svg.getBoundingClientRect(), er = el.getBoundingClientRect(); const x = (e.clientX - r.left) / r.width * W;
    let best = pts[0], bd = Infinity; for (const p of pts) { const d = Math.abs(X(p.t) - x); if (d < bd) { bd = d; best = p; } }
    const px = X(best.t) / W * r.width + (r.left - er.left), py = Y(best.y) / H * r.height + (r.top - er.top);
    cx.setAttribute('x1', X(best.t)); cx.setAttribute('x2', X(best.t)); cx.setAttribute('visibility', 'visible');
    tip.hidden = false; tip.innerHTML = `${dm(best.d)} · <b>${fmt(best.y, o.dec)}</b> ${esc(o.unit)}`;
    tip.style.left = Math.min(Math.max(px, 60), el.clientWidth - 60) + 'px'; tip.style.top = (py - 10) + 'px';
  };
  svg.addEventListener('pointermove', move); svg.addEventListener('pointerdown', move);
  svg.addEventListener('pointerleave', () => { tip.hidden = true; cx.setAttribute('visibility', 'hidden'); });
}

/* ---------- chia sẻ ---------- */
function b64u(bytes) { let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function unb64u(str) { str = str.replace(/-/g, '+').replace(/_/g, '/'); while (str.length % 4) str += '='; const bin = atob(str); return Uint8Array.from(bin, c => c.charCodeAt(0)); }
async function pipeBytes(bytes, stream) { return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer()); }
async function encodePlan(days) {
  const data = { v: 2, d: days.map(d => ({ n: d.name, e: d.exercises.map(x => ({ n: x.name, m: x.muscle, t: x.type, s: x.sets, g: x.repTarget, a: x.repMin, b: x.repMax, d: x.dropSet ? 1 : 0, k: x.step, r: x.rest, u: x.setup || '' })) })) };
  const bytes = new TextEncoder().encode(JSON.stringify(data));
  if ('CompressionStream' in window) { try { return 'SOTA1z.' + b64u(await pipeBytes(bytes, new CompressionStream('deflate-raw'))); } catch (e) {} }
  return 'SOTA1.' + b64u(bytes);
}
async function decodePlan(text) {
  const m = String(text).match(/SOTA1z?\.[A-Za-z0-9_-]+/); if (!m) throw new Error('Không tìm thấy mã giáo án trong nội dung đã dán.');
  const [p, body] = m[0].split('.'); let bytes = unb64u(body);
  if (p === 'SOTA1z') { if (!('DecompressionStream' in window)) throw new Error('Trình duyệt này quá cũ để đọc mã. Hãy cập nhật trình duyệt.'); bytes = await pipeBytes(bytes, new DecompressionStream('deflate-raw')); }
  const data = JSON.parse(new TextDecoder().decode(bytes));
  const clamp = (v, a, b, def) => { v = Number(v); return isFinite(v) ? Math.min(b, Math.max(a, v)) : def; };
  return (data.d || []).slice(0, 14).map(d => ({ name: String(d.n || 'Ngày tập').slice(0, 40), exercises: (d.e || []).slice(0, 20).map(x => {
    const type = TYPES[x.t] ? x.t : 'upper'; const repMin = clamp(x.a, 1, 50, 8); const repMax = Math.max(repMin, clamp(x.b, 1, 50, 12));
    return migrateEx({ name: String(x.n || 'Bài tập').slice(0, 80), muscle: MUSCLES.includes(x.m) ? x.m : 'Khác', type, sets: clamp(x.s, 1, 10, 3), repTarget: clamp(x.g, repMin, 50, Math.min(repMax, 10)), repMin, repMax,
      dropSet: !!x.d, step: clamp(x.k, 0.25, 50, TYPES[type].step), rest: clamp(x.r, 30, 600, TYPES[type].rest), setup: String(x.u || '').slice(0, 1000) }); }) }));
}

async function saveFile(name, data, mime) {
  let dl = null;
  try { if (window.claude && typeof window.claude.use === 'function') dl = await window.claude.use('downloads'); } catch (e) { dl = null; }
  if (dl) {
    try { await dl.save({ filename: name, data: new Blob([data], { type: mime }) }); toast('Đã lưu file'); }
    catch (e) { const c = e && e.code; if (c === 'declined') return; toast(c === 'rejected_extension' || c === 'extension_not_enabled' ? 'Loại file này chỉ tải được trên bản cài điện thoại' : 'Không lưu được file ở đây'); }
    return;
  }
  const blob = data instanceof Blob ? data : new Blob([data], { type: mime });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  toast('Đang tải file');
}
const icsEsc = v => String(v).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
function icsFold(line) {
  const enc = new TextEncoder(); if (enc.encode(line).length <= 75) return line;
  const parts = []; let cur = '', n = 0;
  for (const ch of line) { const b = enc.encode(ch).length, lim = parts.length ? 74 : 75; if (n + b > lim) { parts.push(cur); cur = ''; n = 0; } cur += ch; n += b; }
  parts.push(cur); return parts.join('\r\n ');
}
function buildICS() {
  const [hh, mm] = (state.settings.remindTime || '18:00').split(':').map(Number);
  const before = state.settings.remindBefore ?? 30;
  const BYDAY = ['SU', 'MO', 'TU', 'WE', 'TH', 'FR', 'SA'];
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  const url = /^https?:/.test(location.href) ? location.href.split('#')[0] : '';
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//So Ta//Lich tap//VI', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:Sổ Tạ'];
  for (let dw = 0; dw < 7; dw++) {
    const d = findDay(sched()[dw]); if (!d) continue;
    let k = 0; while (parseYmd(addDays(ymd(), k)).getDay() !== dw) k++;
    const date = addDays(ymd(), k).replace(/-/g, '');
    const desc = `${d.exercises.length} bài: ${d.exercises.map(e => shortName(e.name)).join(', ')}\nMở Sổ Tạ để xem mức tạ tuần này.${url ? '\n' + url : ''}`;
    L.push('BEGIN:VEVENT', `UID:so-ta-${dw}@so-ta.app`, `DTSTAMP:${stamp}`, `DTSTART:${date}T${pad(hh || 0)}${pad(mm || 0)}00`, 'DURATION:PT1H15M',
      `RRULE:FREQ=WEEKLY;BYDAY=${BYDAY[dw]}`, `SUMMARY:${icsEsc('Tập ' + d.name + ' · Sổ Tạ')}`, `DESCRIPTION:${icsEsc(desc)}`,
      'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsEsc((before ? 'Còn ' + (before >= 60 ? before / 60 + ' tiếng' : before + ' phút') + ' nữa tập ' : 'Đến giờ tập ') + d.name)}`, `TRIGGER:${before ? '-PT' + before + 'M' : 'PT0M'}`, 'END:VALARM', 'END:VEVENT');
  }
  L.push('END:VCALENDAR');
  return L.map(icsFold).join('\r\n') + '\r\n';
}

  'set-done': t => {
    initAudio();
    const { e, s } = t.dataset; const set = getSet(+e, s); if (!set) return;
    set.done = !set.done;
    if (set.done && (!set.reps || set.reps <= 0)) { set.done = false; toast('Nhập số rep trước khi bấm ✓'); return; }
    t.setAttribute('aria-pressed', set.done); $(`#row-${e}-${s}`).classList.toggle('done', set.done);
    if (set.done) { const ex = exOrSnap(state.active.entries[+e]); if (s !== 'drop') startRest(ex.rest || 90); requestWake(); }
    updateProgress(); save();
  },
  'add-set': t => { const en = state.active.entries[+t.dataset.e]; const l = en.sets[en.sets.length - 1] || { kg: null, reps: null }; en.sets.push({ kg: l.kg, reps: l.reps, done: false }); save(); render(true); },
  'rm-set': t => { const en = state.active.entries[+t.dataset.e]; if (en.sets.length > 1) en.sets.pop(); save(); render(true); },
  'drop-toggle': t => {
    const en = state.active.entries[+t.dataset.e]; const ex = exOrSnap(en);
    if (en.drop) en.drop = null; else { const k = Math.max(0, ...en.sets.map(s => s.kg || 0)); en.drop = { kg: k ? roundStep(k * 0.7, ex.step) : null, reps: null, done: false }; }
    save(); render(true);
  },
  'finish': () => finishSummary(),
  'save-session': () => saveSession(),
  'cancel-session': () => confirmSheet({ title: 'Huỷ buổi tập này?', text: 'Các set đã ghi trong buổi này sẽ không được lưu.', ok: 'Huỷ buổi tập', danger: true, onOk: discardSession }),
  'rest-add': () => { if (rest.end - Date.now() <= 0) { rest.end = Date.now(); rest.total = 0; clearTimeout(rest.hideT); rest.iv = setInterval(tickRest, 250); } rest.end += 15000; rest.total += 15000; $('#rest-l').textContent = 'Đang nghỉ'; tickRest(); },
  'rest-skip': () => stopRest(),
  'view-photo': t => { const ex = findEx(t.dataset.ex); if (!ex || !ex.photos.length) return; viewer.ex = ex; viewer.i = 0; showViewer(); },
  'viewer-close': () => { $('#viewer').hidden = true; $('#viewer').innerHTML = ''; },
  'viewer-nav': t => { const n = viewer.ex.photos.length; viewer.i = (viewer.i + +t.dataset.d + n) % n; showViewer(); },
  'onb-new': () => { ui.tab = 'plan'; render(); dayNameSheet(null); },
  'onb-sample': () => {
    state.days = SAMPLE.map(([n, list]) => ({ id: uid(), name: n, sample: true, exercises: list.map(newEx) }));
    ui.tab = 'plan'; ui.openDay = state.days[0].id; save(); render(); toast('Đã tạo giáo án mẫu. Bấm từng bài để điền mức tạ đang tập.');
  },
  'add-day': () => dayNameSheet(null),
  'rename-day': t => dayNameSheet(findDay(t.dataset.id)),
  'qpick': t => { $('#f-dayname').value = t.dataset.v; },
  'save-day': t => {
    const name = $('#f-dayname').value.trim(); if (!name) { toast('Nhập tên ngày tập'); return; }
    const d = findDay(t.dataset.id);
    if (d) { d.name = name; delete d.sample; } else { const nd = { id: uid(), name, exercises: [] }; state.days.push(nd); ui.openDay = nd.id; }
    save(); closeSheet(); render(true);
  },
  'del-day': t => { const d = findDay(t.dataset.id); confirmSheet({ title: `Xoá ngày “${esc(d.name)}”?`, text: 'Các bài tập và ảnh trong ngày này sẽ bị xoá. Lịch sử các buổi đã tập vẫn được giữ.', ok: 'Xoá ngày tập', danger: true,
    onOk: () => { d.exercises.forEach(ex => ex.photos.forEach(id => DB.del('photos', id))); state.days = state.days.filter(x => x !== d); save(); render(true); } }); },
  'move-day': t => { const i = state.days.findIndex(d => d.id === t.dataset.id), j = i + +t.dataset.d; if (j < 0 || j >= state.days.length) return; [state.days[i], state.days[j]] = [state.days[j], state.days[i]]; save(); render(true); },
  'toggle-day': t => { ui.openDay = ui.openDay === t.dataset.id ? null : t.dataset.id; render(true); },
  'move-ex': t => { const d = findDay(t.dataset.day); const i = d.exercises.findIndex(e => e.id === t.dataset.id), j = i + +t.dataset.d; if (j < 0 || j >= d.exercises.length) return; [d.exercises[i], d.exercises[j]] = [d.exercises[j], d.exercises[i]]; save(); render(true); },
  'add-ex': t => { ui.draft = { ...newEx(''), dayId: t.dataset.day, isNew: true, added: [], orig: [] }; exSheet(); },
  'edit-ex': t => { const ex = findDay(t.dataset.day).exercises.find(e => e.id === t.dataset.id); ui.draft = { ...ex, photos: [...ex.photos], dayId: t.dataset.day, isNew: false, added: [], orig: [...ex.photos] }; exSheet(); },
  'ph-rm': t => { readDraft(); ui.draft.photos = ui.draft.photos.filter(id => id !== t.dataset.id); const y = $('#sheet-body').scrollTop; exSheet(); $('#sheet-body').scrollTop = y; },
  'cancel-ex': () => { const d = ui.draft; d.added.forEach(id => DB.del('photos', id)); ui.draft = null; closeSheet(); },
  'save-ex': () => {
    readDraft(); const d = ui.draft;
    if (!d.name) { toast('Nhập tên bài tập'); return; }
    if (!(d.sets >= 1 && d.sets <= 10)) { toast('Số set từ 1 đến 10'); return; }
    if (!(d.repMin >= 1 && d.repTarget >= d.repMin && d.repTarget <= 50)) { toast('Rep mục tiêu phải ≥ rep tối thiểu'); return; }
    if (!(d.step > 0)) { toast('Bước tăng tạ phải lớn hơn 0'); return; }
    if (d.curIn != null && d.curIn < 0) { toast('Mức tạ không hợp lệ'); return; }
    const day = findDay(d.dayId);
    const prevBase = d.isNew ? null : baseKg(d);
    const changedKg = d.curIn != null && d.curIn !== prevBase;
    const repMax = Math.max(Math.round(d.repTarget), Math.round(d.repMax || 12));
    const ex = { id: d.id, name: d.name, muscle: d.muscle, type: d.type, sets: Math.round(d.sets), repTarget: Math.round(d.repTarget), repMin: Math.round(d.repMin), repMax,
      dropSet: d.dropSet, warmup: d.warmup, step: d.step, rest: d.rest, setup: d.setup, photos: d.photos, targetKg: d.targetKg,
      currentKg: changedKg ? d.curIn : (d.isNew ? null : d.currentKg), kgSetAt: changedKg ? Date.now() : (d.kgSetAt || null) };
    [...d.orig, ...d.added].filter(id => !d.photos.includes(id)).forEach(id => DB.del('photos', id));
    if (d.isNew) day.exercises.push(ex); else { const i = day.exercises.findIndex(e => e.id === d.id); day.exercises[i] = ex; }
    ui.openDay = day.id; ui.draft = null; save(); closeSheet(); render(true); toast('Đã lưu bài tập');
  },
  'del-ex': () => { const d = ui.draft; confirmSheet({ title: `Xoá “${esc(d.name)}”?`, text: 'Bài tập và ảnh máy sẽ bị xoá khỏi giáo án. Lịch sử đã tập vẫn được giữ.', ok: 'Xoá bài tập', danger: true,
    onOk: () => { const day = findDay(d.dayId); day.exercises = day.exercises.filter(e => e.id !== d.id); [...d.orig, ...d.added].forEach(id => DB.del('photos', id)); ui.draft = null; save(); render(true); } }); },
  'week': t => { ui.weekOff = Math.min(0, ui.weekOff + +t.dataset.d); render(); },
  'open-session': t => sessionSheet(t.dataset.id),
  'del-session': t => confirmSheet({ title: 'Xoá buổi tập này?', text: 'Buổi tập sẽ bị xoá khỏi lịch sử và không thể khôi phục.', ok: 'Xoá buổi tập', danger: true,
    onOk: () => { state.sessions = state.sessions.filter(s => s.id !== t.dataset.id); save(); render(true); } }),
  'prog': t => { ui.progEx = t.dataset.id; progressSheet(); },
  'pm': t => { ui.pm = t.dataset.k; const y = $('#sheet-body').scrollTop; progressSheet(); $('#sheet-body').scrollTop = y; },
  'metric': t => { ui.metric = t.dataset.k; $$('[data-act="metric"]').forEach(b => b.setAttribute('aria-pressed', b.dataset.k === ui.metric)); drawBodyChart(); },
  'mode': t => { state.settings.progMode = t.dataset.k; save(); render(true); },
  'pace': t => { state.settings.pace = t.dataset.k; save(); render(true); },
  'body-add': () => bodySheet(null),
  'pose': t => { ui.pose = t.dataset.k; ui.cmpA = ui.cmpB = null; render(true); },
  'bp-view': t => showBodyViewer(t.dataset.id),
  'bp-del': t => {
    if (!t.dataset.armed) { t.dataset.armed = '1'; t.textContent = 'Bấm lần nữa để xoá'; return; }
    const bp = state.bodyPhotos.find(x => x.id === t.dataset.id); if (!bp) return;
    state.bodyPhotos = state.bodyPhotos.filter(x => x !== bp); DB.del('photos', bp.photoId); photoCache.delete(bp.photoId);
    save(); handlers['viewer-close'](); render(true); toast('Đã xoá ảnh');
  },
  'ics': () => saveFile('lich-tap-so-ta.ics', buildICS(), 'text/calendar'),
  'body-edit': t => bodySheet(state.body.find(e => e.id === t.dataset.id)),
  'body-save': t => {
    const date = $('#b-date').value || ymd(); const vals = {};
    for (const m of METRICS) { const v = num($('#b-' + m.k).value); if (v != null) vals[m.k] = v; }
    if (!Object.keys(vals).length) { toast('Nhập ít nhất một chỉ số'); return; }
    let e = t.dataset.id ? state.body.find(x => x.id === t.dataset.id) : null;
    const clash = state.body.find(x => x.date === date && x !== e);
    if (clash) { state.body = state.body.filter(x => x !== clash); if (!e) e = { id: clash.id }; }
    if (!e) e = { id: uid() };
    state.body = state.body.filter(x => x.id !== e.id);
    state.body.push({ id: e.id, date, ...vals });
    save(); closeSheet(); render(true); toast('Đã lưu số đo');
  },
  'body-del': t => { state.body = state.body.filter(e => e.id !== t.dataset.id); save(); closeSheet(); render(true); },
  'share': () => shareSheet(),
  'copy': t => copyText(t.dataset.t),
  'native-share': () => { const l = $('#sh-link'); if (!l) return; navigator.share({ title: 'Giáo án Sổ Tạ', text: 'Giáo án tập gym của mình, mở link để nhập vào Sổ Tạ:', url: l.value }).catch(() => {}); },
  'import-open': () => importSheet(''),
  'import-preview': async () => {
    const box = $('#imp-preview'); if (!box) return;
    try {
      const days = await decodePlan($('#imp-code').value); if (!days.length) throw new Error('Giáo án trống.');
      ui.importDays = days;
      box.innerHTML = `<div class="eyebrow" style="margin-bottom:6px">${days.length} ngày tập</div>` + days.map(d => `<div class="pr"><b>${esc(d.name)}</b><span class="small muted" style="text-align:right">${d.exercises.map(e => esc(shortName(e.name))).join(', ')}</span></div>`).join('') +
        `<div class="sh-actions"><button class="btn gold big" data-act="import-apply" data-m="add">Thêm vào giáo án của tôi</button>${state.days.length ? '<button class="btn" data-act="import-apply" data-m="replace">Thay giáo án hiện tại</button>' : ''}</div>`;
    } catch (e) { box.innerHTML = `<div class="banner"><span class="bi">${ICON.alert}</span><div><b>Không đọc được mã</b><p>${esc(e.message || 'Kiểm tra lại link hoặc mã đã dán, có thể bị thiếu ký tự.')}</p></div></div>`; }
  },
  'import-apply': t => {
    const days = (ui.importDays || []).map(d => ({ id: uid(), name: d.name, exercises: d.exercises.map(x => ({ ...x, id: uid(), photos: [] })) }));
    if (t.dataset.m === 'replace') { state.days.forEach(d => d.exercises.forEach(ex => ex.photos.forEach(id => DB.del('photos', id)))); state.days = days; } else state.days.push(...days);
    ui.importDays = null; save(); closeSheet(); ui.tab = 'plan'; ui.openDay = days[0] && days[0].id; render(); toast('Đã nhập giáo án. Bấm từng bài để điền mức tạ của bạn.');
  },
  'backup': async () => {
    toast('Đang chuẩn bị file sao lưu…');
    const photos = {}; for (const k of usedPhotoIds()) { const v = await DB.get('photos', k); if (v) photos[k] = v; }
    const data = { app: 'so-ta', v: 2, exportedAt: new Date().toISOString(), state, photos };
    await saveFile(`so-ta-sao-luu-${ymd()}.json`, JSON.stringify(data), 'application/json');
  },
  'install': async () => { if (!deferredInstall) return; deferredInstall.prompt(); try { await deferredInstall.userChoice; } catch (e) {} deferredInstall = null; render(true); },
  'wipe': () => confirmSheet({ title: 'Xoá toàn bộ dữ liệu?', text: 'Giáo án, lịch sử tập, ảnh và số đo trên máy này sẽ bị xoá vĩnh viễn. Nên tải file sao lưu trước.', ok: 'Xoá toàn bộ', danger: true,
    onOk: async () => { await DB.clear('photos', usedPhotoIds()); photoCache.clear(); state = freshState(); state.updatedAt = Date.now(); flush(true); stopRest(); releaseWake(); ui.tab = 'today'; render(); toast('Đã xoá dữ liệu'); } }),
  'deload-done': () => { state.settings.cycleStart = ymd(); save(); render(true); toast('Bắt đầu chu kỳ mới'); },
  'confirm-cancel': () => { pendingConfirm = null; if (ui.draft) exSheet(); else closeSheet(); },
  'confirm-ok': () => { const f = pendingConfirm; pendingConfirm = null; closeSheet(); f && f(); },
  'close-sheet': () => { if (ui.draft) { handlers['cancel-ex'](); return; } closeSheet(); }
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
  const f = handlers[t.dataset.act]; if (f) { e.preventDefault(); f(t, e); }
});
document.addEventListener('input', e => {
  const t = e.target; const b = t.dataset && t.dataset.bind;
  if (t.id === 'cmp-range') { setCompare(+t.value); return; }
  if (ui.draft && ['f-cur', 'f-tgt', 'f-step', 'f-sets', 'f-rtgt', 'f-rmin'].includes(t.id)) draftRoad();
  if (!b) return;
  if (b === 'set' && state.active) { const set = getSet(+t.dataset.e, t.dataset.s); if (set) { set[t.dataset.f] = num(t.value); if (t.dataset.s === '0' && t.dataset.f === 'kg') refreshWarm(+t.dataset.e); save(); } }
  else if (b === 'sched') { const v = t.value; state.settings.schedule = { ...sched(), [t.dataset.dow]: v || '' }; t.classList.toggle('on', !!v); save(); }
  else if (b === 'note' && state.active) { state.active.entries[+t.dataset.e].note = t.value; save(); }
  else if (b === 'setting') { const k = t.dataset.k; state.settings[k] = ['name', 'remindTime'].includes(k) ? t.value : num(t.value); save(); renderHeader(); }
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.id === 'f-name' && ui.draft && ui.draft.isNew) {
    const lib = LIB.find(l => l[0] === t.value.trim());
    if (lib) { $('#f-muscle').value = lib[1]; $('#f-type').value = lib[2]; $('#f-warm').checked = lib[2] !== 'iso'; $('#f-step').value = fmtIn(TYPES[lib[2]].step); $('#f-rest').value = String(TYPES[lib[2]].rest); draftRoad(); }
  }
  if (t.id === 'f-type' && ui.draft) { const ty = TYPES[t.value]; $('#f-rest').value = String(ty.rest); if (ui.draft.isNew) { $('#f-step').value = fmtIn(ty.step); $('#f-warm').checked = t.value !== 'iso'; } draftRoad(); }
  if (t.dataset && t.dataset.bind === 'cmp') { ui['cmp' + t.dataset.k] = t.value; render(true); }
  if ((t.id === 'f-photo-cam' || t.id === 'f-photo-lib') && ui.draft) {
    const files = [...t.files].slice(0, 6); if (!files.length) return; readDraft();
    for (const f of files) { try { const id = await storePhoto(f); ui.draft.photos.push(id); ui.draft.added.push(id); } catch (err) { toast('Không đọc được ảnh, thử lại'); } }
    const y = $('#sheet-body').scrollTop; exSheet(); $('#sheet-body').scrollTop = y;
  }
  if (t.id === 'bp-in' && t.files && t.files[0]) {
    try { const photoId = await storePhoto(t.files[0]); state.bodyPhotos.push({ id: uid(), date: ymd(), t: Date.now(), pose: ui.pose, photoId }); ui.cmpB = null; save(); render(true); toast(`Đã lưu ảnh ${ui.pose.toLowerCase()} hôm nay`); }
    catch (err) { toast('Không đọc được ảnh, thử lại'); }
    t.value = '';
  }
  if (t.dataset && t.dataset.cap) {
    const ex = findEx(t.dataset.cap); const f = t.files && t.files[0]; if (!ex || !f) return;
    try { const id = await storePhoto(f); ex.photos.unshift(id); save(); toast('Đã lưu ảnh máy tập');
      if (!$('#viewer').hidden) { viewer.ex = ex; viewer.i = 0; showViewer(); }
      if (ui.tab === 'today') render(true); } catch (err) { toast('Không đọc được ảnh, thử lại'); }
    t.value = '';
  }
  if (t.id === 'restore-file' && t.files[0]) {
    try {
      const data = JSON.parse(await t.files[0].text());
      if (data.app !== 'so-ta' || !data.state || !Array.isArray(data.state.days)) throw new Error();
      ui.restoreData = data;
      confirmSheet({ title: 'Khôi phục từ file sao lưu?', text: `File ngày ${data.exportedAt ? new Date(data.exportedAt).toLocaleDateString('vi-VN') : '?'} có ${data.state.days.length} ngày tập và ${(data.state.sessions || []).length} buổi đã tập. Toàn bộ dữ liệu hiện tại trên máy này sẽ được thay bằng file này.`, ok: 'Khôi phục', danger: true,
        onOk: async () => { const d = ui.restoreData; await DB.clear('photos', usedPhotoIds()); photoCache.clear(); for (const [k, v] of Object.entries(d.photos || {})) await DB.put('photos', k, v);
          loadState(d.state); state.updatedAt = Date.now(); flush(true); ui.restoreData = null; ui.tab = 'today'; render(); toast('Đã khôi phục dữ liệu'); } });
    } catch (err) { toast('File không phải bản sao lưu Sổ Tạ'); }
    t.value = '';
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (!$('#viewer').hidden) handlers['viewer-close'](); else if (!$('#sheet').hidden) handlers['close-sheet'](); } });
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'hidden') { if (saveT) flush(true); else Cloud.sync(true); return; }
  if (state.active && ui.tab === 'today') requestWake();
  if (inArtifact && !Cloud.ok && syncStatus === 'retry') { connectCloud(state); return; }
  if (Cloud.ok && !state.active && !saveT) {
    try { const snap = await Cloud.base.get(); if (snap.exists && (snap.data().updatedAt || 0) > (state.updatedAt || 0)) { const r = await Cloud.pull(); loadState(r); Cloud.remember(r); LDB.put('kv', 'state', JSON.parse(JSON.stringify(state))); if ($('#sheet').hidden) render(true); } } catch (e) {}
  }
});
window.addEventListener('pagehide', () => { if (saveT) flush(true); });
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; if (ui.tab === 'more') render(true); });
setInterval(() => { const el = $('#elapsed'); if (el && state.active) el.textContent = fmtDur(Date.now() - state.active.startedAt); }, 1000);

/* ---------- khởi động ---------- */
(async () => {
  await LDB.open();
  const saved = await LDB.get('kv', 'state');
  if (saved && Array.isArray(saved.days)) loadState(saved);
  render();
  connectCloud(saved && Array.isArray(saved.days) ? saved : null);
  const h = location.hash;
  if (h.startsWith('#nhap=')) { const code = decodeURIComponent(h.slice(6)); try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} importSheet(code); }
  if ('serviceWorker' in navigator && location.protocol === 'https:' && document.documentElement.dataset.pwa === '1') { navigator.serviceWorker.register('sw.js').catch(() => {}); }
})();
window.__sota = { suggest, roadmap, exHistory, baseKg, buildICS, warmSets, get state() { return state; } };
})();
</script>
