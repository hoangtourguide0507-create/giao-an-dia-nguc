<!doctype html>
<html lang="vi" data-pwa="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Địa Ngục">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Giáo Án Địa Ngục</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Chakra+Petch:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap">
<style>
/* Layout: app một cột kiểu super-app — thẻ hero vàng cho buổi tiếp theo, thẻ bo tròn lớn, thanh tab nổi dưới đáy. Một giao diện tối duy nhất: đen than + vàng gold. */
:root{
  --glow1:#fff3c9; --glow2:#d9b45b; --sheen:rgba(255,255,255,.5);
  --bg:#0a0a0b; --surface:#151517; --surface-2:#1d1d21; --surface-3:#27272c; --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.12);
  --fg:#f6f3ec; --fg-2:#bdb7aa; --muted:#827d72;
  --gold:#d9b45b; --gold-hi:#f2d68d; --gold-lo:#b8862f; --gold-ink:#1b1406; --gold-soft:rgb(var(--acc-rgb) / .14);
  --up:#46d38f; --hold:#93b6ff; --down:#ff7470; --almost:#f2d68d;
  --font:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r-lg:22px; --r:16px; --r-sm:13px; --r-btn:14px; --r-hero:26px; --r-nav:24px; --pill:999px; --nav-h:68px;
  --font-d:var(--font);
  --acc-rgb:217 180 91; --acc-hi-rgb:242 214 141; --up-rgb:70 211 143; --hold-rgb:147 182 255; --down-rgb:255 116 112;
  --top-bg:rgba(10,10,11,.86); --bar-bg:rgba(24,24,27,.92); --on-up:#06170e; --on-down:#1a0505;
  --hero-border:rgb(217 180 91 / .32);
  --hero-bg:radial-gradient(130% 120% at 100% 0%,rgb(242 214 141 / .30),rgb(217 180 91 / .08) 45%,transparent 70%),linear-gradient(180deg,#1b1812,#121213);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5;margin:0;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 32px);-webkit-tap-highlight-color:transparent}
body.resting{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 120px)}
button,input,select,textarea{font:inherit;color:inherit}
button,label[for]{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tn{font-variant-numeric:tabular-nums}
.ico .t{fill:none}
.nav button[aria-current="page"] .ico .t{fill:currentColor;fill-opacity:.22}
.nav .lb{display:block}
.muted{color:var(--muted)} .small{font-size:13px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--top-bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.avatar{width:40px;height:40px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;
  color:var(--gold-ink);background:var(--pc,linear-gradient(140deg,var(--gold-hi),var(--gold-lo)))}
.avatar.pcol{color:#15110a}
.hello{min-width:0;flex:1}
.hello b{display:block;font-size:16px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hello span{font-size:12.5px;color:var(--muted)}
.cycle{font-size:12px;font-weight:700;color:var(--gold);background:var(--gold-soft);border:1px solid rgb(var(--acc-rgb) / .28);padding:6px 11px;border-radius:var(--pill);white-space:nowrap}
.cycle.deload{color:var(--gold-ink);background:var(--gold)}

/* type */
main{padding-block:18px}
.sec{margin-bottom:28px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.h{font-size:19px;font-weight:700;margin:0;letter-spacing:-.01em;text-wrap:balance}
.h1{font-size:28px;font-weight:800;margin:0;line-height:1.15;letter-spacing:-.02em;text-wrap:balance}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--gold)}
.sub{color:var(--fg-2);margin:6px 0 0}
.link{border:0;background:none;color:var(--gold);font-weight:600;font-size:14px;padding:4px 0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 18px;border-radius:var(--r-btn);border:1px solid var(--line-2);
  background:var(--surface-2);font-weight:600;font-size:14.5px;color:var(--fg);text-decoration:none;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.gold{border:0;color:var(--gold-ink);background:linear-gradient(135deg,var(--gold-hi),var(--gold) 55%,var(--gold-lo));box-shadow:0 8px 24px -10px rgb(var(--acc-rgb) / .6)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:4px 14px;font-size:13.5px;border-radius:var(--r-btn)}
.btn.big{min-height:54px;font-size:16px;width:100%;border-radius:var(--r-btn)}
.btn.danger{color:var(--down)}
.btn.danger-fill{background:var(--down);color:var(--on-down);border:0}
.btn:disabled{opacity:.4;cursor:default}
.btn .ico{width:19px;height:19px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.empty{border:1.5px dashed var(--line-2);border-radius:var(--r);padding:18px;color:var(--fg-2);font-size:14px}

/* chips & badges */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:4px 9px;border-radius:var(--pill);background:var(--surface-3);color:var(--fg-2);white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;letter-spacing:.04em;padding:4px 9px;border-radius:var(--pill);white-space:nowrap}
.badge.up{color:var(--up);background:rgb(var(--up-rgb) / .13)}
.badge.almost,.badge.deload{color:var(--gold-hi);background:var(--gold-soft)}
.badge.hold,.badge.start{color:var(--hold);background:rgb(var(--hold-rgb) / .13)}
.badge.down{color:var(--down);background:rgb(var(--down-rgb) / .13)}
.badge.new{color:var(--fg-2);background:var(--surface-3)}

/* banners */
.banner{display:flex;gap:12px;padding:14px;border-radius:var(--r);margin-bottom:16px;background:var(--surface);border:1px solid rgb(var(--acc-rgb) / .3)}
.banner .bi{width:36px;height:36px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--gold-soft);color:var(--gold);font-weight:800}
.banner.info{border-color:rgb(var(--hold-rgb) / .28)} .banner.info .bi{background:rgb(var(--hold-rgb) / .13);color:var(--hold)}
.banner b{display:block;font-size:14.5px}
.banner p{margin:2px 0 10px;color:var(--fg-2);font-size:13.5px}
.banner p:last-child{margin-bottom:0}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:var(--r-hero);padding:20px 18px 18px;margin-bottom:22px;border:1px solid var(--hero-border);background:repeating-linear-gradient(135deg,rgba(255,255,255,.028) 0 2px,transparent 2px 13px),var(--hero-bg)}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;border:22px solid rgb(var(--acc-rgb) / .10);pointer-events:none}
.hero .h1{margin-top:6px;font-size:30px}
.hero .meta{color:var(--fg-2);font-size:13.5px;margin-top:4px}
.hero ul{list-style:none;margin:16px 0 18px;padding:0;display:flex;flex-direction:column;gap:8px}
.hero li{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px}
.hero li span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg-2)}
.hero li b{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.hero li b.up{color:var(--up)}
.hero .more{font-size:12.5px;color:var(--muted)}

/* day scroller */
.hscroll{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.dcard{scroll-snap-align:start;flex:0 0 152px;text-align:left;display:flex;flex-direction:column;gap:3px;padding:14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);min-height:118px}
.dcard b{font-size:16.5px;font-weight:700;line-height:1.25}
.dcard span{font-size:12.5px;color:var(--fg-2)}
.dcard .last{margin-top:auto;color:var(--muted);font-size:12px}

/* week mini */
.wk{display:flex;flex-direction:column;gap:14px}
.dots{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dots div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--muted)}
.dots i{width:30px;height:30px;border-radius:50%;background:var(--surface-3);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;font-weight:700;color:var(--fg-2)}
.dots .on i{background:linear-gradient(140deg,var(--gold-hi),var(--gold-lo));color:var(--gold-ink)}
.dots .today i{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--gold)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{padding:12px;border-radius:var(--r-sm);background:var(--surface-2)}
.kpi .k{font-size:24px;font-weight:800;line-height:1.1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--fg-2)}

/* lists */
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);width:100%;text-align:left}
.li .lt{font-weight:600;font-size:14.5px;display:block;min-width:0;overflow-wrap:anywhere}
.li .ls{font-size:12.5px;color:var(--muted)}
.li .lr{text-align:right;flex:none}
.li .big{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.arrow{color:var(--up);font-weight:700}
.delta{font-size:12px;font-weight:600}
.delta.good{color:var(--up)} .delta.flat{color:var(--muted)} .delta.other{color:var(--fg-2)} .delta.bad{color:var(--down)}
.kpi .k small{font-size:15px;font-weight:700;margin-left:1px}
.cmpline{margin-top:12px;padding:12px 14px;border-radius:var(--r-sm);background:var(--surface-2);font-size:13.5px;color:var(--fg-2)}
.cmpline b{color:var(--fg)}

/* session */
.sbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 61px);z-index:15;background:var(--bg);padding-block:6px 12px;margin-bottom:6px}
.sbar-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.elapsed{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--gold)}
.prog{height:6px;border-radius:3px;background:var(--surface-3);margin-top:10px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold-lo),var(--gold-hi));border-radius:3px;transition:width .25s}
.prog-l{font-size:12px;color:var(--muted);margin-top:5px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);margin-bottom:14px;overflow:hidden}
.ex-photo{position:relative;display:block;width:100%;aspect-ratio:16/8;max-width:100%;background:var(--surface-2)}
.ex-photo img{width:100%;height:100%;object-fit:cover;display:block}
.ex-photo .cnt{position:absolute;left:12px;bottom:10px;font-size:11.5px;font-weight:600;background:rgba(0,0,0,.6);padding:3px 8px;border-radius:var(--pill)}
.camfab{position:absolute;right:10px;bottom:10px;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(10,10,11,.72);color:var(--gold);border:1px solid rgb(var(--acc-rgb) / .4)}
.camfab .ico{width:20px;height:20px}
.cam-empty{display:flex;align-items:center;gap:12px;margin:14px 14px 0;padding:12px;border-radius:14px;border:1.5px dashed rgb(var(--acc-rgb) / .35);color:var(--fg-2);font-size:13px;background:rgb(var(--acc-rgb) / .04)}
.cam-empty .ci{width:42px;height:42px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--gold-soft);color:var(--gold)}
.cam-empty b{display:block;color:var(--fg);font-size:14px}
.ex-body{padding:14px}
.ex-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.ex-name{font-weight:700;font-size:17px;line-height:1.3;min-width:0;overflow-wrap:anywhere}
.ex-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.target{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;padding:12px 14px;border-radius:var(--r-sm);background:var(--surface-2)}
.target .tl{font-size:12px;color:var(--fg-2)}
.target .tv{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums}
.target .tv small{font-size:14px;font-weight:600;color:var(--fg-2)}
.target .tv.up{color:var(--up)}
.target .prev{text-align:right;font-size:12px;color:var(--muted)}
.target .prev b{display:block;font-size:14px;color:var(--fg-2);font-weight:600}
.sug{margin:10px 0 0;font-size:13.5px;color:var(--fg-2)}
.sug strong{color:var(--fg)}
details.setup{margin-top:10px;font-size:13.5px}
details.setup summary{color:var(--gold);font-weight:600;list-style:none}
details.setup summary::-webkit-details-marker{display:none}
details.setup p{margin:6px 0 0;white-space:pre-wrap;color:var(--fg-2)}
.sets{margin-top:14px;display:flex;flex-direction:column;gap:7px}
.sethead,.setrow{display:grid;grid-template-columns:24px 1fr 1fr 46px;gap:8px;align-items:center}
.sethead{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sethead span:nth-child(2),.sethead span:nth-child(3){text-align:center}
.setno{font-weight:800;font-size:15px;color:var(--muted);text-align:center}
.setrow.drop .setno{color:var(--gold)}
.stepper{display:flex;align-items:stretch;border-radius:var(--r-sm);background:var(--surface-2);border:1px solid var(--line);overflow:hidden;min-width:0;transition:background .15s}
.stepper button{width:34px;border:0;background:transparent;font-size:20px;color:var(--fg-2);flex:none}
.stepper button:active{background:var(--surface-3)}
.stepper input{width:100%;min-width:0;border:0;background:transparent;text-align:center;font-weight:700;font-size:19px;font-variant-numeric:tabular-nums;height:46px;padding:0}
.stepper input:focus{outline:none;background:var(--surface-3)}
.setrow.done .stepper{background:rgb(var(--up-rgb) / .08);border-color:rgb(var(--up-rgb) / .25)}
.check{width:46px;height:46px;border-radius:var(--r-sm);border:1.5px solid var(--line-2);background:transparent;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.check[aria-pressed="true"]{background:var(--up);border-color:var(--up);color:var(--on-up)}
.check .ico{stroke-width:2.6}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.note{width:100%;margin-top:10px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2);padding:10px 12px;font-size:16px;resize:vertical;min-height:44px;color:var(--fg)}
.note::placeholder,.inp::placeholder{color:var(--muted)}
.sess-actions{display:flex;flex-direction:column;gap:8px;margin-top:20px}

/* plan */
.pday{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);margin-bottom:12px;overflow:hidden}
.pday-h{display:flex;align-items:center;gap:12px;padding:16px;width:100%;border:0;background:transparent;text-align:left}
.pday-h .t{flex:1;min-width:0}
.pday-h b{display:block;font-size:18px;font-weight:700}
.pday-h span{font-size:13px;color:var(--fg-2)}
.chev{color:var(--muted);transition:transform .2s}
.pday.open .chev{transform:rotate(90deg)}
.exl{list-style:none;margin:0;padding:0 16px}
.exr{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding-block:10px}
.exr-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;border:0;background:transparent;text-align:left;padding:0}
.exr-main .t{min-width:0;flex:1}
.exr-main .n{display:block;font-weight:600;font-size:14.5px;line-height:1.3;overflow-wrap:anywhere}
.exr-main .m{font-size:12px;color:var(--muted)}
.exr-kg{text-align:right;flex:none}
.exr-kg b{display:block;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.exr-kg span{font-size:11.5px;color:var(--up);font-weight:600;white-space:nowrap}
.exr-kg span.none{color:var(--gold)}
.thumb{width:48px;height:48px;border-radius:13px;object-fit:cover;background:var(--surface-3);display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
img.thumb{display:block}
.thumb .ico{width:22px;height:22px}
.mv{display:flex;flex-direction:column;gap:3px}
.mv button{width:30px;height:24px;border-radius:7px;border:1px solid var(--line);background:transparent;color:var(--fg-2);padding:0;display:flex;align-items:center;justify-content:center}
.mv .ico{width:16px;height:16px}
.pday-a .btn .ico{width:17px;height:17px}
.mv button:disabled{opacity:.3}
.pday-a{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px 16px;border-top:1px solid var(--line)}

/* progress tab */
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.weeknav .btn{width:44px;padding:0}
.weeknav .wl{font-size:19px;font-weight:700;text-align:center}
.vol{display:flex;flex-direction:column;gap:12px}
.vrow{display:grid;grid-template-columns:84px 1fr 56px;gap:10px;align-items:center}
.vrow .vn{font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vtrack{position:relative;height:12px;border-radius:6px;background:var(--surface-3)}
.vband{position:absolute;top:0;bottom:0;background:rgb(var(--acc-rgb) / .16);border-left:1.5px solid rgb(var(--acc-rgb) / .55);border-right:1.5px solid rgb(var(--acc-rgb) / .55)}
.vfill{position:absolute;left:0;top:3px;bottom:3px;border-radius:0 4px 4px 0;background:var(--fg-2)}
.vrow .vv{font-size:16px;font-weight:800;text-align:right;font-variant-numeric:tabular-nums;line-height:1.1}
.vrow .vv small{display:block;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.st-low{color:var(--gold-hi)} .st-ok{color:var(--up)} .st-high{color:var(--hold)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:12px}
.legend i{display:inline-block;width:18px;height:9px;border-radius:3px;vertical-align:middle;margin-right:6px;background:rgb(var(--acc-rgb) / .16);border:1.5px solid rgb(var(--acc-rgb) / .55)}

/* body */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:18px}
.tile{padding:13px 14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.tile .tl{font-size:12px;font-weight:600;color:var(--fg-2)}
.tile .tv{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.2;font-variant-numeric:tabular-nums}
.tile .tv small{font-size:13px;font-weight:600;color:var(--fg-2);margin-left:3px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--pill);padding:7px 13px;font-size:13px;font-weight:600;color:var(--fg-2)}
.chips button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.chart{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:10px 6px 4px;margin-bottom:18px;touch-action:pan-y}
.sheet-panel .chart{background:var(--surface-2)}
.chart svg{display:block;width:100%}
.chart .ctitle{font-size:13px;font-weight:600;color:var(--fg-2);padding:2px 10px 0}
.chart .tip{position:absolute;pointer-events:none;background:var(--fg);color:var(--bg);font-size:12px;padding:5px 9px;border-radius:9px;white-space:nowrap;transform:translate(-50%,-100%)}
.chart .tip b{font-size:14px}
.chart .nodata{padding:28px 12px;text-align:center;color:var(--muted);font-size:14px}

/* roadmap */
.road{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.road::-webkit-scrollbar{display:none}
.road div{flex:0 0 auto;min-width:78px;padding:10px 12px;border-radius:var(--r-sm);background:var(--surface-2);border:1px solid var(--line)}
.sheet-panel .road div{background:var(--surface-3)}
.road div.now{border-color:var(--gold);background:var(--gold-soft)}
.road div.dl{border-style:dashed;border-color:var(--line-2)}
.road span{display:block;font-size:11px;font-weight:600;color:var(--muted);white-space:nowrap}
.road b{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.road div.hit b{color:var(--up)}
.eta{font-size:13.5px;color:var(--fg-2);margin:10px 0 0}
.eta b{color:var(--fg)}

/* forms */
.fsec{margin-top:20px}
.fsec > .eyebrow{display:block;margin-bottom:10px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--fg-2);min-width:0}
label.f.full,.full{grid-column:1/-1}
.inp{width:100%;min-height:48px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface-2);padding:10px 12px;font-size:16px;color:var(--fg);font-weight:500}
.inp:focus{outline:none;border-color:var(--gold)}
select.inp{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 21px,calc(100% - 13px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
textarea.inp{min-height:88px;resize:vertical}
.inp.kg{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.unit{font-weight:500;color:var(--muted)}
.fhint{font-size:12px;color:var(--muted);font-weight:400;margin:0}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;padding:0 4px;font-size:14.5px;font-weight:600}
.toggle input{appearance:none;-webkit-appearance:none;width:48px;height:28px;border-radius:var(--pill);background:var(--surface-3);position:relative;transition:background .2s;flex:none;margin:0}
.toggle input::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:var(--fg-2);transition:transform .2s,background .2s}
.toggle input:checked{background:var(--gold)}
.toggle input:checked::after{transform:translateX(20px);background:var(--gold-ink)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:var(--r-btn);background:var(--surface-2);border:1px solid var(--line)}
.seg button{border:0;background:transparent;border-radius:calc(var(--r-btn) - 3px);min-height:40px;font-size:13.5px;font-weight:600;color:var(--fg-2);padding:4px 6px}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink)}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.ph{position:relative}
.ph img{width:78px;height:78px;object-fit:cover;border-radius:13px;display:block;background:var(--surface-3)}
.ph button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:2px solid var(--surface);background:var(--fg);color:var(--bg);padding:0;display:flex;align-items:center;justify-content:center}
.ph button .ico{width:13px;height:13px;stroke-width:2.6}
.addph{width:78px;height:78px;border-radius:13px;border:1.5px dashed rgb(var(--acc-rgb) / .45);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--gold);background:rgb(var(--acc-rgb) / .05)}
.addph.lib{border-color:var(--line-2);color:var(--fg-2);background:transparent}
.qpick{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.qpick button{border:1px solid var(--line-2);background:var(--surface-2);border-radius:var(--pill);padding:6px 12px;font-size:13px;font-weight:500}

/* me */
.set-card{margin-bottom:12px}
.set-card h3{font-size:16px;font-weight:700;margin:0 0 4px}
.set-card > p{margin:0 0 12px;color:var(--fg-2);font-size:13.5px}
.rules{font-size:13.5px;color:var(--fg-2)}
.rules h4{font-size:14px;color:var(--fg);margin:14px 0 4px}
.rules ul{margin:0;padding-left:18px}
.rules li{margin-bottom:4px}
.tbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.tbl th,.tbl td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tbl-wrap{overflow-x:auto}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:0 12px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.nav .bar{max-width:536px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h);padding:6px;border-radius:var(--r-nav);pointer-events:auto;
  background:var(--bar-bg);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line-2);box-shadow:0 12px 30px -12px rgba(0,0,0,.8)}
.nav button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;background:transparent;color:var(--muted);font-size:10.5px;font-weight:600;border-radius:calc(var(--r-nav) - 6px)}
.nav button[aria-current="page"]{color:var(--gold);background:var(--gold-soft)}
.nav .dot{position:absolute;top:8px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--down);box-shadow:0 0 0 2px var(--surface)}

/* rest */
.rest{position:fixed;left:0;right:0;z-index:29;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 16px);padding-inline:12px}
.rest-in{position:relative;overflow:hidden;max-width:536px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:12px 14px 14px;border-radius:var(--r-lg);
  background:linear-gradient(135deg,var(--gold-hi),var(--gold) 60%,var(--gold-lo));color:var(--gold-ink);box-shadow:0 12px 30px -10px rgb(var(--acc-rgb) / .55)}
.rest-bar{position:absolute;left:0;bottom:0;height:4px;width:100%;background:color-mix(in srgb,var(--gold-ink) 50%,transparent);transform-origin:left}
.rest-l{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.rest-t{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.02em}
.rest button{border:0;background:color-mix(in srgb,var(--gold-ink) 14%,transparent);color:var(--gold-ink);border-radius:var(--r-sm);padding:8px 12px;font-size:13px;font-weight:700}
.rest .sp{margin-left:auto}

/* sheet */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.66)}
.sheet-panel{position:relative;width:100%;max-width:560px;max-height:93vh;max-height:93dvh;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);
  border-radius:var(--r-hero) var(--r-hero) 0 0;border-top:1px solid var(--line-2);padding:10px 16px calc(22px + env(safe-area-inset-bottom,0px))}
.sheet-panel .inp{background:var(--surface-2)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--surface-3);margin:0 auto 14px}
.sh-title{font-size:22px;font-weight:800;margin:0 0 4px;line-height:1.2;letter-spacing:-.01em;text-wrap:balance}
.sh-text{color:var(--fg-2);margin:0 0 14px;font-size:14px}
.sh-actions{display:flex;flex-direction:column;gap:8px;margin-top:20px}
.pr{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;word-break:break-all}

/* viewer */
.viewer{position:fixed;inset:0;z-index:60;background:#000;display:flex;flex-direction:column;color:#f6f3ec;
  padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.viewer .vtop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.viewer .vtop b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.viewer button,.viewer label{border:1px solid rgba(255,255,255,.22);background:transparent;color:#f6f3ec;border-radius:12px;min-height:40px;padding:6px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.viewer label{color:var(--gold);border-color:rgb(var(--acc-rgb) / .45)}
.viewer .vimg{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding-block:12px}
.viewer .vimg img{max-height:100%;max-width:100%;object-fit:contain;border-radius:12px}
.viewer .vcap{white-space:pre-wrap;font-size:14px;color:#cfc9bd;max-height:26vh;overflow:auto;background:#141416;border-radius:14px;padding:12px}
.viewer .vnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 100px);z-index:70;
  background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:14px;font-size:14px;font-weight:600;width:max-content;max-width:calc(100% - 32px);text-align:center;box-shadow:0 10px 30px -10px rgba(0,0,0,.8)}
/* alarm popup */
.alarm{position:fixed;inset:0;z-index:65;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.alarm-in{width:100%;max-width:340px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:26px 20px 20px;border-radius:var(--r-hero);background:var(--surface);border:1px solid rgb(var(--acc-rgb) / .45);box-shadow:0 0 0 6px rgb(var(--acc-rgb) / .12),0 24px 60px -20px rgba(0,0,0,.8)}
.alarm-ico{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--gold);color:var(--gold-ink);margin-bottom:8px;animation:ring 1s ease-in-out infinite}
.alarm-ico .ico{width:32px;height:32px;stroke-width:2}
.alarm-in b{font-family:var(--font-d);font-size:26px;font-weight:800}
.alarm-in span{color:var(--fg-2);font-size:14px;margin-bottom:12px}
@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(-14deg)}40%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(5deg)}}
.diag{margin-top:12px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.diag div{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:var(--r-sm);background:var(--surface-2)}
.diag b{font-weight:700} .diag .ok{color:var(--up)} .diag .no{color:var(--gold-hi)}
/* sync */
.sync-h{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.sync-h h3{margin:0}
.sync-dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
.sync.ok .sync-dot{background:var(--up);box-shadow:0 0 0 4px rgb(var(--up-rgb) / .15)}
.sync.warn{border-color:rgb(var(--acc-rgb) / .35)} .sync.warn .sync-dot{background:var(--gold)}
/* warm-up */
.warm{margin-top:12px;padding:10px 12px;border-radius:14px;border:1px dashed var(--line-2)}
.warm-h{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--gold)}
.warm-h .ico{width:16px;height:16px}
.warm-h span{font-weight:500;color:var(--muted);margin-left:auto;font-size:12px}
.warm-sets{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.warm-sets button{border:1px solid var(--line-2);background:var(--surface-2);border-radius:10px;padding:6px 10px;font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--fg)}
.warm-sets button small{font-weight:500;color:var(--muted);margin-left:2px}
.warm-sets button[aria-pressed="true"]{background:rgb(var(--up-rgb) / .12);border-color:rgb(var(--up-rgb) / .35);color:var(--up)}
/* body photos */
.bp-strip{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-bottom:14px}
.bp-strip::-webkit-scrollbar{display:none}
.bp-strip button{flex:0 0 auto;width:86px;border:0;padding:0;background:none;text-align:left;color:var(--fg-2);display:flex;flex-direction:column;gap:4px}
.bp-strip img{width:86px;height:114px;object-fit:cover;border-radius:12px;display:block;background:var(--surface-3)}
.bp-strip span{font-size:11.5px;font-weight:600}
.cmp-sel{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.cmp-sel .inp{min-height:44px;font-size:16px}
.cmp{position:relative;aspect-ratio:3/4;max-width:100%;border-radius:18px;overflow:hidden;background:var(--surface-2);user-select:none;-webkit-user-select:none;touch-action:pan-y}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.cmp .handle{position:absolute;top:0;bottom:0;left:50%;width:2px;background:var(--gold);transform:translateX(-1px);pointer-events:none}
.cmp .handle i{position:absolute;top:50%;left:50%;width:36px;height:36px;border-radius:50%;transform:translate(-50%,-50%);background:var(--gold);color:var(--gold-ink);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.5)}
.cmp .handle .ico{width:18px;height:18px;stroke-width:2.2}
.cmp .tag{position:absolute;top:10px;font-size:12px;font-weight:700;background:rgba(0,0,0,.65);padding:4px 9px;border-radius:var(--pill);color:#f6f3ec}
.cmp .tag.l{left:10px} .cmp .tag.r{right:10px;color:var(--gold-hi)}
.cmp-range{width:100%;margin:12px 0 0;accent-color:var(--gold)}
.note-line{font-size:12.5px;color:var(--muted);margin:10px 0 0}
/* schedule */
.sched{display:flex;flex-direction:column;gap:6px}
.sched label{display:grid;grid-template-columns:76px 1fr;align-items:center;gap:10px;font-size:14px;font-weight:600;color:var(--fg-2)}
.sched select{width:100%;min-height:44px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--surface-2);color:var(--fg);font-size:16px;font-weight:600;padding:6px 12px;appearance:none;-webkit-appearance:none}
.sched select.on{border-color:var(--gold);background:var(--gold-soft);color:var(--gold-hi)}
.dots .plan i{box-shadow:inset 0 0 0 1.5px var(--gold);background:transparent;color:var(--gold)}
.miss{color:var(--gold);font-weight:600}
.restcard{display:flex;align-items:center;gap:12px;padding:14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);margin-bottom:14px;font-size:14px;color:var(--fg-2)}
.restcard .bi{width:36px;height:36px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;background:rgb(var(--hold-rgb) / .13);color:var(--hold)}
.restcard b{display:block;color:var(--fg);font-size:14.5px}
.viewer .vdel{color:#ff7470;border-color:rgb(var(--down-rgb) / .4)}

/* who / profiles */
.who{display:flex;align-items:center;gap:12px;flex:1;min-width:0;border:0;background:none;padding:0;text-align:left;color:inherit;font:inherit}
.hello b .ico{width:16px;height:16px;vertical-align:-3px;margin-left:4px;color:var(--muted)}
.prow{justify-content:flex-start;align-items:flex-start;gap:12px}
.prow.cur{border-color:var(--gold)}
.pav{width:44px;height:44px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#15110a;background:var(--pc)}
.pinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.pinfo .lt{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pstats{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--fg-2)}
.pstats b{font-size:15px;color:var(--fg);font-variant-numeric:tabular-nums;font-family:var(--font-d)}
/* hero reasons, day picker, readiness */
.hero .why{font-size:13px;color:var(--fg-2);margin-top:8px}
.hero .why b{color:var(--fg);font-weight:600}
.hero .warnline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:13px;font-weight:600;color:var(--gold-hi)}
.dcard{position:relative;color:var(--fg)}
.dcard.sel{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.dcard .tag{position:absolute;top:10px;right:10px;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--gold-ink);background:var(--gold);padding:2px 7px;border-radius:var(--pill)}
.dcard .dc-t,.dcard .dc-r{display:flex;flex-direction:column;gap:3px;min-width:0}
.dcard .dc-t b{padding-right:42px}
.dcard .dc-r{margin-top:auto;padding-top:8px}
.dcard.custom{border-style:dashed}
.dcard.custom .ico{color:var(--gold);width:22px;height:22px}
.rs{font-size:12px;font-weight:700}
.rs.ok{color:var(--up)} .rs.mid{color:var(--almost)} .rs.low{color:var(--down)}
.rdy{display:flex;flex-direction:column;gap:11px}
.rrow{display:grid;grid-template-columns:86px 1fr minmax(92px,auto);gap:10px;align-items:center;font-size:13.5px}
.rrow .rn{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .rs{text-align:right}
.rbar{height:8px;border-radius:4px;background:var(--surface-3);overflow:hidden}
.rbar i{display:block;height:100%;border-radius:4px}
.rbar i.ok{background:var(--up)} .rbar i.mid{background:var(--almost)} .rbar i.low{background:var(--down)}
.li.pick .pk{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line-2);display:flex;align-items:center;justify-content:center;color:transparent;flex:none}
.li.pick .pk .ico{width:16px;height:16px}
.li.pick[aria-pressed="true"]{border-color:var(--gold)}
.li.pick[aria-pressed="true"] .pk{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.li.pick .addi{color:var(--gold)}
.sess-actions .btn .ico{width:18px;height:18px}
/* skin swatch icons */
.skin .sw .si{position:absolute;right:8px;top:9px;display:flex;gap:6px;color:var(--sa)}
.skin .sw em{right:76px}
.skin .sw i{display:none}
.skin .sw b{font-size:19px}
.skin .sw .si .ico{width:17px;height:17px}

/* ===== icon styles per skin (also used by the swatch previews) ===== */
:root[data-skin="light"] .ico{stroke-width:2}
:root[data-skin="light"] .ico .t{fill:currentColor;fill-opacity:.18}
:root[data-skin="neon"] .ico{stroke-width:2;stroke-linecap:square;stroke-linejoin:miter}
:root[data-skin="hell"] .ico{fill:currentColor;stroke:none}
.skin[data-sk="gold"] .sw .ico{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.skin[data-sk="gold"] .sw .ico .t{fill:none}
.skin[data-sk="light"] .sw .ico{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.skin[data-sk="light"] .sw .ico .t{fill:currentColor;fill-opacity:.25}
.skin[data-sk="neon"] .sw .ico{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:square;stroke-linejoin:miter}
.skin[data-sk="neon"] .sw .ico .t{fill:none}
.skin[data-sk="hell"] .sw .ico{fill:currentColor;stroke:none}

/* ===== layout per skin ===== */
/* Trắng Tinh: thanh tab dạng viên thuốc, thẻ ngày dạng lưới 2 cột, nút tròn */
:root[data-skin="light"] .nav .bar{display:flex;justify-content:space-between;align-items:center;padding:8px 10px}
:root[data-skin="light"] .nav button{flex:0 0 auto;width:50px;height:48px;border-radius:999px}
:root[data-skin="light"] .nav button .lb{display:none}
:root[data-skin="light"] .nav button[aria-current="page"]:not(.fab){flex-direction:row;width:auto;padding:0 18px;gap:8px;background:var(--gold);color:#fff;font-size:13.5px}
:root[data-skin="light"] .nav button[aria-current="page"]:not(.fab) .lb{display:block}
:root[data-skin="light"] .nav button[aria-current="page"] .ico .t{fill-opacity:.35}
:root[data-skin="light"] .nav .dot{top:6px;left:auto;right:8px}
:root[data-skin="light"] .check{border-radius:50%}
:root[data-skin="light"] .daypick{display:grid;grid-template-columns:1fr 1fr;overflow:visible;margin-inline:0;padding-inline:0;scroll-snap-type:none}
:root[data-skin="light"] .daypick .dcard{min-height:112px}
:root[data-skin="light"] .h{font-size:20px;font-weight:800}
:root[data-skin="light"] .avatar{box-shadow:0 0 0 3px #fff,0 4px 12px rgba(16,24,40,.15)}
:root[data-skin="light"] .rbar{height:10px;border-radius:5px}

/* Neon Đêm: góc cắt vát, thanh tab dính đáy, tiêu đề kiểu HUD */
:root[data-skin="neon"]{--cut:10px}
:root[data-skin="neon"] :is(.card,.ex,.pday,.li,.tile,.dcard,.hero,.kpi,.target,.restcard,.banner,.chart,.btn,.check,.stepper,.road div,.seg,.inp,.alarm-in,.note){clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut))}
:root[data-skin="neon"] :is(.btn,.check,.stepper,.inp,.kpi,.road div,.note,.seg){--cut:6px}
:root[data-skin="neon"] .h::before{content:"//";color:var(--mag);margin-right:8px}
:root[data-skin="neon"] .nav{padding:0}
:root[data-skin="neon"] .nav .bar{max-width:none;border-radius:0;border-width:1px 0 0;border-color:rgb(var(--acc-rgb) / .45);height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));padding:4px 8px env(safe-area-inset-bottom,0px);box-shadow:0 -12px 30px -14px rgb(var(--acc-rgb) / .5)}
:root[data-skin="neon"] .daypick{display:grid;grid-template-columns:1fr 1fr;overflow:visible;margin-inline:0;padding-inline:0;scroll-snap-type:none}
:root[data-skin="neon"] .rbar,:root[data-skin="neon"] .rbar i{border-radius:0}
:root[data-skin="neon"] .rbar{background:repeating-linear-gradient(90deg,var(--surface-3) 0 8px,transparent 8px 10px)}

/* Lửa Địa Ngục: hero tràn viền, nút vát chéo, tab chỉ có icon, ngày tập xếp dọc */
:root[data-skin="hell"] .nav{padding:0}
:root[data-skin="hell"] .nav .bar{max-width:none;border-radius:0;border-width:1px 0 0;height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));padding:0 10px env(safe-area-inset-bottom,0px)}
:root[data-skin="hell"] .nav button .lb{display:none}
:root[data-skin="hell"] .nav .ico{width:26px;height:26px}
:root[data-skin="hell"] .nav button[aria-current="page"]{background:none;color:#fff6ec}
:root[data-skin="hell"] .nav button[aria-current="page"]:not(.fab) .ico{width:48px;height:48px;padding:11px;border-radius:50%;background:linear-gradient(135deg,#f2611c,#c0100b);box-shadow:0 6px 18px -6px rgba(255,74,28,.9)}
:root[data-skin="hell"] .hero{margin-inline:-16px;border-radius:0;border-width:1px 0;padding-inline:20px}
:root[data-skin="hell"] .btn.gold{clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%);border-radius:0}
:root[data-skin="hell"] .daypick{display:flex;flex-direction:column;overflow:visible;margin-inline:0;padding-inline:0;gap:8px;scroll-snap-type:none}
:root[data-skin="hell"] .daypick .dcard{flex:none;min-height:0;display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:12px;padding:14px 16px}
:root[data-skin="hell"] .daypick .dcard .dc-r{margin:0;padding:0;text-align:right;align-items:flex-end}
:root[data-skin="hell"] .daypick .dcard .tag{position:static;justify-self:start;grid-column:1/-1;margin-bottom:6px}
:root[data-skin="hell"] .daypick .dcard .dc-t b{padding-right:0}
:root[data-skin="hell"] :is(.card,.ex,.pday,.li,.tile,.dcard){box-shadow:inset 0 -2px 0 rgb(var(--acc-rgb) / .3)}
:root[data-skin="hell"] .sec-head .h{font-size:24px}
:root[data-skin="hell"] .rbar{height:6px;border-radius:0}

/* ===== chuyển động ===== */
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
html,body{overscroll-behavior-y:none;overflow-x:hidden;max-width:100%}
@supports (overflow:clip){html,body{overflow-x:clip}}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
*{touch-action:manipulation}
.hscroll,.chips,.road,.bp-strip,.tbl-wrap{overscroll-behavior-x:contain}
main,#view{max-width:100%;overflow-x:clip}
img,svg,canvas,video{max-width:100%}
/* 1. viền sáng chạy quanh thẻ */
.glow{position:relative;isolation:isolate}
.glow::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.6px;pointer-events:none;z-index:3;
  background:conic-gradient(from var(--ang),transparent 0 62%,var(--glow2) 76%,var(--glow1) 86%,transparent 96%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
  animation:ring-spin 3.4s linear infinite}
@keyframes ring-spin{to{--ang:360deg}}
:root[data-skin="light"] .hero.glow{--glow1:#ffffff;--glow2:#c9d4ff}
.rest-in.glow{--glow1:#ffffff;--glow2:rgba(255,255,255,.7)}
.rest-in.glow::before{padding:2.5px;animation-duration:1.2s}
.rest-in.glow .rest-t{animation:tick-pulse 1s ease-in-out infinite}
@keyframes tick-pulse{50%{transform:scale(1.08)}}
.rest-t{display:inline-block;transform-origin:left center}
/* 2. lấp lánh + vệt sáng trên "Tuần này tăng tạ" */
.twk{display:inline-flex;color:var(--gold-hi);margin-left:6px;vertical-align:-2px;animation:twinkle 2.4s ease-in-out infinite}
.twk .ico{width:18px;height:18px}
@keyframes twinkle{0%,100%{transform:scale(.7) rotate(0);opacity:.5}50%{transform:scale(1.15) rotate(25deg);opacity:1}}
.li.upli{position:relative;overflow:hidden}
.li.upli::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 38%,rgb(var(--up-rgb) / .16) 50%,transparent 62%);transform:translateX(-110%);animation:sheen 4.2s ease-in-out infinite}
.li.upli:nth-child(2)::after{animation-delay:.35s} .li.upli:nth-child(3)::after{animation-delay:.7s} .li.upli:nth-child(4)::after{animation-delay:1.05s}
/* 3. kéo xuống để làm mới */
#ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 66px);z-index:19;width:34px;height:34px;margin-left:-17px;border-radius:50%;opacity:0;pointer-events:none;
  background:var(--surface-2);border:1px solid var(--line-2);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px -6px rgba(0,0,0,.6)}
#ptr i{width:16px;height:16px;border-radius:50%;border:2.2px solid var(--gold);border-right-color:transparent;display:block}
#ptr.ready i{border-color:var(--up);border-right-color:transparent}
#ptr.spin{opacity:1!important}
#ptr.spin i{animation:spin360 .7s linear infinite}
@keyframes spin360{to{transform:rotate(360deg)}}
/* 4. vệt sáng quét qua nút Bắt đầu */
.hero .btn.gold{position:relative;overflow:hidden}
.hero .btn.gold::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 35%,var(--sheen) 50%,transparent 65%);transform:translateX(-120%);animation:sheen 3.8s ease-in-out infinite 1s}
:root[data-skin="light"] .hero .btn.gold{--sheen:rgba(47,85,255,.22)}
@keyframes sheen{0%,55%{transform:translateX(-120%)}85%,100%{transform:translateX(120%)}}
/* 5. nút Tập nổi ở giữa thanh tab */
.nav button.fab{overflow:visible;background:none!important;box-shadow:none!important}
.nav .fabc{width:58px;height:58px;margin-top:-30px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;
  color:var(--gold-ink);background:linear-gradient(140deg,var(--gold-hi),var(--gold) 55%,var(--gold-lo));box-shadow:0 0 0 5px var(--bg),0 10px 24px -6px rgb(var(--acc-rgb) / .75);transition:transform .2s}
.nav .fabc .ico{width:27px;height:27px}
.nav button.fab:active .fabc{transform:scale(.92)}
.nav button.fab .lb{color:var(--gold);font-weight:700;margin-top:3px}
.nav button.fab:not([aria-current]) .lb{color:var(--muted)}
.nav button.fab .dot{top:-24px;left:calc(50% + 14px)}
:root[data-skin="light"] .nav button.fab{width:64px}
:root[data-skin="light"] .nav button.fab .lb{display:none}
:root[data-skin="light"] .nav .fabc{background:var(--gold);color:#fff;box-shadow:0 0 0 5px var(--bg),0 10px 22px -6px rgba(47,85,255,.7)}
:root[data-skin="light"] .nav .fabc .ico .t{fill-opacity:.35}
:root[data-skin="neon"] .nav .fabc{border-radius:4px;background:var(--gold);clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);box-shadow:none;filter:drop-shadow(0 0 10px rgb(var(--acc-rgb) / .8))}
:root[data-skin="hell"] .nav .fabc{background:linear-gradient(135deg,#f2611c,#c0100b);color:#fff6ec}
:root[data-skin="hell"] .nav button.fab .lb{display:none}
/* 6. bấm ✓ nảy */
.check.pop{animation:pop .42s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.setrow.flash{animation:flash .7s ease-out}
@keyframes flash{0%{background:rgb(var(--up-rgb) / .28)}100%{background:transparent}}
.prog i{transition:width .45s cubic-bezier(.2,1.2,.4,1)}
/* 7. pháo giấy */
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:80}
/* 8. chuyển tab */
#view.enter{animation:view-in .34s cubic-bezier(.2,.8,.2,1)}
@keyframes view-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:360px){.stepper button{width:28px}.sethead,.setrow{grid-template-columns:18px 1fr 1fr 44px;gap:6px}.check{width:44px}}

/* display face */
.h1,.sh-title,.kpi .k,.tile .tv,.target .tv,.elapsed,.rest-t,.li .big,.road b,.vrow .vv,.exr-kg b,.hero li b,.weeknav .wl,.setno{font-family:var(--font-d)}
/* skin picker */
.skins{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.skin{border:1.5px solid var(--line-2);border-radius:var(--r);padding:8px;background:var(--surface-2);text-align:left;display:flex;flex-direction:column;gap:4px;color:var(--fg);min-width:0}
.skin[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 3px rgb(var(--acc-rgb) / .22)}
.skin .sw{position:relative;height:70px;border-radius:calc(var(--r) - 5px);background:var(--sb);overflow:hidden;margin-bottom:4px}
.skin .sw em{position:absolute;left:8px;top:8px;right:46px;height:26px;border-radius:var(--srad);background:var(--ss)}
.skin .sw i{position:absolute;right:8px;top:8px;width:30px;height:26px;border-radius:var(--srad);background:var(--sa)}
.skin .sw b{position:absolute;left:10px;bottom:6px;font-family:var(--sfont);font-size:22px;font-weight:700;color:var(--sf);line-height:1}
.skin .sw u{position:absolute;right:8px;bottom:9px;width:44px;height:8px;border-radius:4px;background:var(--sa);opacity:.55;text-decoration:none}
.skin .sn{font-weight:700;font-size:14px}
.skin .sd{font-size:12px;color:var(--muted);line-height:1.35}
/* guide */
details.guide{margin-top:12px;font-size:13.5px;color:var(--fg-2);background:var(--surface-2);border-radius:var(--r-sm);padding:10px 12px}
details.guide summary{color:var(--gold);font-weight:600}
details.guide ol{margin:8px 0 2px;padding-left:20px;display:flex;flex-direction:column;gap:6px}
details.guide b{color:var(--fg)}

/* ===== Giao diện: Trắng Tinh ===== */
:root[data-skin="light"]{
  --glow1:#9fb3ff; --glow2:#2f55ff;
  --bg:#eef1f6; --surface:#ffffff; --surface-2:#f3f5f9; --surface-3:#e4e8ef; --line:rgba(15,23,40,.08); --line-2:rgba(15,23,40,.15);
  --fg:#0f1728; --fg-2:#475467; --muted:#7b8698;
  --gold:#2f55ff; --gold-hi:#5d7cff; --gold-lo:#1d3ad6; --gold-ink:#ffffff; --gold-soft:rgb(47 85 255 / .10); --acc-rgb:47 85 255; --acc-hi-rgb:93 124 255;
  --up:#0b9b5a; --up-rgb:11 155 90; --hold:#7044e8; --hold-rgb:112 68 232; --down:#e0393e; --down-rgb:224 57 62; --almost:#2f55ff;
  --top-bg:rgba(238,241,246,.86); --bar-bg:rgba(255,255,255,.94); --on-up:#ffffff; --on-down:#ffffff;
  --hero-bg:linear-gradient(140deg,#2f55ff 0%,#5b3bea 100%); --hero-border:transparent;
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; --font-d:'Plus Jakarta Sans',system-ui,sans-serif;
  --r-lg:24px; --r:18px; --r-sm:14px; --r-btn:999px; --r-hero:28px; --r-nav:28px; --pill:999px;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 10px 30px -14px rgba(16,24,40,.18);
  color-scheme:light;
}
:root[data-skin="light"] :is(.card,.ex,.pday,.li,.tile,.dcard,.chart,.restcard,.banner){border-color:transparent;box-shadow:var(--shadow)}
:root[data-skin="light"] .hero{color:#fff;box-shadow:0 18px 40px -18px rgba(47,85,255,.75)}
:root[data-skin="light"] .hero :is(.eyebrow,.meta,.more,.sub,.why,.warnline,li span:first-child){color:rgba(255,255,255,.86)}
:root[data-skin="light"] .hero .why b{color:#fff}
:root[data-skin="light"] .hero li b.up{color:#b9ffd9}
:root[data-skin="light"] .hero .miss{color:#ffe08a}
:root[data-skin="light"] .hero::after{border-color:rgba(255,255,255,.12)}
:root[data-skin="light"] .hero .btn.gold{background:#fff;color:#1d3ad6;box-shadow:none}
:root[data-skin="light"] .hero .btn:not(.gold){background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);color:#fff}
:root[data-skin="light"] .btn.gold{box-shadow:0 10px 24px -12px rgba(47,85,255,.8)}
:root[data-skin="light"] .sheet-bg{background:rgba(15,23,40,.42)}
:root[data-skin="light"] .nav .bar{box-shadow:0 10px 30px -10px rgba(16,24,40,.25)}
:root[data-skin="light"] .ex-photo .cnt{color:#fff}

/* ===== Giao diện: Neon Đêm ===== */
:root[data-skin="neon"]{
  --glow1:#ff2bd6; --glow2:#00eaff;
  --bg:#07060f; --surface:#0f0d1d; --surface-2:#171429; --surface-3:#231e3d; --line:rgba(0,234,255,.13); --line-2:rgba(0,234,255,.28);
  --fg:#eaf7ff; --fg-2:#a3b5d6; --muted:#6c7897; --mag:#ff2bd6;
  --gold:#00eaff; --gold-hi:#7cf6ff; --gold-lo:#0094ff; --gold-ink:#03121a; --gold-soft:rgb(0 234 255 / .12); --acc-rgb:0 234 255; --acc-hi-rgb:124 246 255;
  --up:#3dff8f; --up-rgb:61 255 143; --hold:#c48bff; --hold-rgb:196 139 255; --down:#ff3d6e; --down-rgb:255 61 110; --almost:#7cf6ff;
  --top-bg:rgba(7,6,15,.9); --bar-bg:rgba(15,13,29,.95); --on-up:#03140a; --on-down:#1a0208;
  --hero-bg:linear-gradient(135deg,rgba(255,43,214,.22),rgba(0,234,255,.07) 60%),#0f0d1d; --hero-border:rgba(255,43,214,.6);
  --font:'Chakra Petch',system-ui,sans-serif; --font-d:'Chakra Petch',system-ui,sans-serif;
  --r-lg:6px; --r:4px; --r-sm:3px; --r-btn:3px; --r-hero:6px; --r-nav:6px; --pill:3px;
  color-scheme:dark;
}
:root[data-skin="neon"] body{background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.022) 0 1px,transparent 1px 3px)}
:root[data-skin="neon"] :is(.h1,.sh-title,.h,.eyebrow,.btn,.badge,.nav button,.chip){text-transform:uppercase;letter-spacing:.05em}
:root[data-skin="neon"] .eyebrow{color:var(--mag)}
:root[data-skin="neon"] .hero{box-shadow:0 0 0 1px rgba(255,43,214,.3),0 0 34px -8px rgba(255,43,214,.55)}
:root[data-skin="neon"] .hero::after{border-color:rgba(255,43,214,.14);border-radius:0;transform:rotate(45deg)}
:root[data-skin="neon"] .btn.gold{background:var(--gold);box-shadow:0 0 18px rgb(var(--acc-rgb) / .55)}
:root[data-skin="neon"] :is(.elapsed,.rest-t,.hero .h1){text-shadow:0 0 14px rgb(var(--acc-rgb) / .65)}
:root[data-skin="neon"] .nav button[aria-current="page"]:not(.fab){background:transparent;box-shadow:inset 0 -2px 0 var(--gold);border-radius:0}
:root[data-skin="neon"] :is(.avatar,.pav,.dots i,.camfab,.cmp .handle i,.sync-dot){border-radius:3px}
:root[data-skin="neon"] .rest-in{background:var(--surface);color:var(--gold);border:1px solid var(--gold);box-shadow:0 0 24px rgb(var(--acc-rgb) / .4)}
:root[data-skin="neon"] .rest button{color:var(--gold);background:rgb(var(--acc-rgb) / .12)}
:root[data-skin="neon"] .rest-bar{background:var(--mag)}
:root[data-skin="neon"] .check[aria-pressed="true"]{box-shadow:0 0 14px rgb(var(--up-rgb) / .6)}

/* ===== Giao diện: Lửa Địa Ngục ===== */
:root[data-skin="hell"]{
  --glow1:#ffd36e; --glow2:#ff4a1c;
  --bg:#0b0504; --surface:#170a08; --surface-2:#22100c; --surface-3:#321711; --line:rgba(255,110,70,.10); --line-2:rgba(255,110,70,.22);
  --fg:#fdf0ea; --fg-2:#d6ab9e; --muted:#9a7266;
  --gold:#ff4a1c; --gold-hi:#ffb22e; --gold-lo:#c0100b; --gold-ink:#fff6ec; --gold-soft:rgb(255 74 28 / .15); --acc-rgb:255 74 28; --acc-hi-rgb:255 178 46;
  --up:#8ee86a; --up-rgb:142 232 106; --hold:#ffc773; --hold-rgb:255 199 115; --down:#ff5f9e; --down-rgb:255 95 158; --almost:#ffb22e;
  --top-bg:rgba(11,5,4,.9); --bar-bg:rgba(23,10,8,.95); --on-up:#0b1a04; --on-down:#1a0208;
  --hero-bg:radial-gradient(120% 90% at 50% 125%,rgba(255,74,28,.55),rgba(192,16,11,.18) 45%,transparent 70%),linear-gradient(180deg,#1e0b07,#120605); --hero-border:rgba(255,74,28,.4);
  --font:'Be Vietnam Pro',system-ui,sans-serif; --font-d:'Oswald','Arial Narrow',sans-serif;
  --r-lg:12px; --r:10px; --r-sm:8px; --r-btn:8px; --r-hero:14px; --r-nav:14px; --pill:6px;
  color-scheme:dark;
}
:root[data-skin="hell"] :is(.h1,.sh-title,.h){text-transform:uppercase;letter-spacing:.01em;font-family:var(--font-d);font-weight:700}
:root[data-skin="hell"] .hero .h1{font-size:36px}
:root[data-skin="hell"] .eyebrow{color:var(--gold-hi)}
:root[data-skin="hell"] .hero::after{display:none}
:root[data-skin="hell"] :is(.btn.gold,.rest-in){background:linear-gradient(135deg,#f2611c,#ff4a1c 45%,#c0100b)}
:root[data-skin="hell"] .btn.gold{text-transform:uppercase;letter-spacing:.06em;font-family:var(--font-d);font-weight:600;font-size:17px;box-shadow:0 10px 28px -10px rgba(255,74,28,.85)}
:root[data-skin="hell"] .avatar{background:var(--pc,linear-gradient(140deg,#ffb22e,#c0100b))}

/* v14: đau, HLV, thời gian */
.badge.pain{color:var(--down);background:rgb(var(--down-rgb) / .13)}
.banner.pain{border-color:rgb(var(--down-rgb) / .45)}
.banner.pain .bi{background:rgb(var(--down-rgb) / .14);color:var(--down)}
.qpick button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);font-weight:700}
.redflag{margin-top:14px;padding:12px 14px;border-radius:var(--r-sm);background:rgb(var(--down-rgb) / .1);border:1px solid rgb(var(--down-rgb) / .3);font-size:13px;line-height:1.45;color:var(--fg-2)}
.redflag b{color:var(--down)}
.painrow{display:flex;align-items:center;gap:10px;cursor:default}
.painrow .btn{flex:none}
.hero .meta.painl{font-weight:700}
.coach{display:block;width:100%;text-align:left;color:inherit;font:inherit;margin-top:12px;padding:14px;border-radius:var(--r);background:var(--surface-2);border:1px solid var(--line)}
.coach.cur{border-color:rgb(var(--acc-rgb) / .5)}
.coach .ch{display:flex;align-items:center;gap:10px}
.coach .ch b{font-size:16px}
.coach .kpis{margin-top:12px}

    }

  } finally { URL.revokeObjectURL(url); }

  const c = $('#cmp'); if (!c) return; let on = false;
  const at = e => { const r = c.getBoundingClientRect(); setCompare((e.clientX - r.left) / r.width * 100); };
  c.addEventListener('pointerdown', e => { on = true; at(e); });
  c.addEventListener('pointermove', e => { if (on) at(e); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(n => c.addEventListener(n, () => { on = false; }));
}
async function showBodyViewer(id) {
  const bp = state.bodyPhotos.find(x => x.id === id); if (!bp) return;
  let src = photoCache.get(bp.photoId); if (!src) { src = await DB.get('photos', bp.photoId); if (src) photoCache.set(bp.photoId, src); }

function drawBodyChart() {
  const el = $('#body-chart'); if (!el) return;

  const pts = bodySorted().filter(e => mval(e, m) != null).map(e => ({ t: parseYmd(e.date).getTime(), d: e.date, y: mval(e, m) }));

}

function rulesHtml() {
  return `<div class="rules"><p>Dựa trên khuyến nghị tập kháng lực của ACSM (Hiệp hội Y học Thể thao Hoa Kỳ): khi làm vượt số rep mục tiêu thì tăng tạ 2–10%.</p>
  <h4>Theo tuần (mặc định)</h4><ul><li>Đạt đủ số set × rep mục tiêu (vd 3×10) → tuần sau <span class="badge up">TĂNG TẠ</span>.</li><li>Chưa đủ → <span class="badge hold">GIỮ</span> mức tạ, cố thêm rep.</li>
  <li>3 buổi không tiến bộ, hoặc 2 buổi liền dưới rep tối thiểu → <span class="badge down">GIẢM</span>.</li></ul>
  <h4>Mức tăng mỗi tuần</h4><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Tốc độ</th><th>Bài lớn</th><th>Bài cô lập</th></tr></thead><tbody>
  <tr><td>Thận trọng</td><td>~2,5%, sau 2 tuần đạt</td><td>~2%</td></tr><tr><td>Chuẩn</td><td>~5%</td><td>~2,5%</td></tr><tr><td>Nhanh</td><td>~7,5%</td><td>~5%</td></tr></tbody></table></div>
  <p class="small" style="margin-top:6px">Luôn làm tròn theo bước tăng của máy, tối thiểu 1 bước. Ví dụ bench 40 kg, tốc độ Chuẩn, bước 2,5 kg (bánh 1,25 kg mỗi bên): 40 → 42,5 → 45 kg.</p>
  <h4>Khác</h4><ul><li>10–20 set nặng mỗi nhóm cơ mỗi tuần, mỗi set còn dư khoảng 1–3 rep.</li><li>Nghỉ 2–3 phút với bài lớn, 1–2 phút với bài cô lập.</li><li>Khởi động trước bài lớn đầu tiên của mỗi nhóm cơ: ~50% × 10, ~70% × 5, ~85% × 2.</li><li>Deload mỗi 6–8 tuần: giảm ~10% tạ và khoảng một nửa số set.</li>

function profStats(st) {
  if (!st) return { wk: 0, planned: 0, sets: 0, last: null, w: null, dw: null, active: false };
  const days = weekDaysOf(0), S = st.sessions || [];
  const ws = S.filter(x => x.date >= days[0] && x.date <= days[6]);
  const sets = ws.reduce((a, x) => a + x.entries.reduce((b, e) => b + e.sets.length + (e.drop ? 1 : 0), 0), 0);
  const last = S.reduce((a, b) => !a || b.startedAt > a.startedAt ? b : a, null);
  const B = [...(st.body || [])].filter(e => e.weight != null).sort((a, b) => a.date.localeCompare(b.date));
  const cur = B[B.length - 1], ref = cur ? [...B].reverse().find(e => daysBetween(e.date, cur.date) >= 28) : null;
  const planned = Object.values((st.settings || {}).schedule || {}).filter(v => v && (st.days || []).some(d => d.id === v)).length;
  return { wk: ws.length, planned, sets, last, w: cur ? cur.weight : null, dw: cur && ref ? cur.weight - ref.weight : null, active: !!st.active };
}

  return withState(st, () => {
    const days = weekDaysOf(0), today = ymd(), S = state.sessions;
    const ws = S.filter(x => x.date >= days[0] && x.date <= days[6]);
    const sets = ws.reduce((a, x) => a + sessStats(x).sets, 0);
    const cs = state.settings.cycleStart;
    const missed = days.filter(d => { const id = sched()[parseYmd(d).getDay()]; return d < today && cs && d >= cs && id && findDay(id) && !S.some(x => x.date === d); });
    const sg = allEx().map(x => ({ ...x, sg: suggest(x.ex) }));
    const last = S.reduce((a, b) => !a || b.startedAt > a.startedAt ? b : a, null);
    const planned = Object.values(sched()).filter(v => v && findDay(v)).length;
    const nx = schedNext();
    return { ws: ws.length, planned, sets, missed, last, active: !!state.active,
      ups: sg.filter(x => x.sg.kind === 'up'), almost: sg.filter(x => x.sg.kind === 'almost'), downs: sg.filter(x => x.sg.kind === 'down'),
      pains: activePains(), today: nx && nx.k === 0 ? findDay(nx.dayId).name : null, nDays: state.days.length };
  });
}

/* ---------- file & lịch ---------- */
async function saveFile(name, data, mime) {
  let dl = null;
  try { if (window.claude && typeof window.claude.use === 'function') dl = await window.claude.use('downloads'); } catch (e) { dl = null; }
  if (dl) {
    try { await dl.save({ filename: name, data: new Blob([data], { type: mime }) }); toast('Đã lưu file'); }
    catch (e) { const c = e && e.code; if (c === 'declined') return; toast(c === 'rejected_extension' || c === 'extension_not_enabled' ? 'Loại file này chỉ tải được trên bản cài điện thoại' : 'Không lưu được file ở đây'); }
    return;
  }
  const blob = data instanceof Blob ? data : new Blob([data], { type: mime });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  toast('Đang tải file');
}
const icsEsc = v => String(v).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
function icsFold(line) {
  const enc = new TextEncoder(); if (enc.encode(line).length <= 75) return line;
  const parts = []; let cur = '', n = 0;
  for (const ch of line) { const b = enc.encode(ch).length, lim = parts.length ? 74 : 75; if (n + b > lim) { parts.push(cur); cur = ''; n = 0; } cur += ch; n += b; }
  parts.push(cur); return parts.join('\r\n ');
}
function buildICS() {
  const [hh, mm] = (state.settings.remindTime || '18:00').split(':').map(Number);
  const before = state.settings.remindBefore ?? 30;
  const BYDAY = ['SU', 'MO', 'TU', 'WE', 'TH', 'FR', 'SA'];
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  const url = /^https?:/.test(location.href) ? location.href.split('#')[0] : '';
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Giao An Dia Nguc//Lich tap//VI', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:Giáo Án Địa Ngục'];
  for (let dw = 0; dw < 7; dw++) {
    const d = findDay(sched()[dw]); if (!d) continue;
    let k = 0; while (parseYmd(addDays(ymd(), k)).getDay() !== dw) k++;
    const date = addDays(ymd(), k).replace(/-/g, '');
    const desc = `${d.exercises.length} bài: ${d.exercises.map(e => shortName(e.name)).join(', ')}\nMở Giáo Án Địa Ngục để xem mức tạ tuần này.${url ? '\n' + url : ''}`;
    L.push('BEGIN:VEVENT', `UID:so-ta-${dw}@so-ta.app`, `DTSTAMP:${stamp}`, `DTSTART:${date}T${pad(hh || 0)}${pad(mm || 0)}00`, 'DURATION:PT1H15M',
      `RRULE:FREQ=WEEKLY;BYDAY=${BYDAY[dw]}`, `SUMMARY:${icsEsc('Tập ' + d.name + ' · Giáo Án Địa Ngục')}`, `DESCRIPTION:${icsEsc(desc)}`,
      'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsEsc((before ? 'Còn ' + (before >= 60 ? before / 60 + ' tiếng' : before + ' phút') + ' nữa tập ' : 'Đến giờ tập ') + d.name)}`, `TRIGGER:${before ? '-PT' + before + 'M' : 'PT0M'}`, 'END:VALARM', 'END:VEVENT');
  }
  L.push('END:VCALENDAR');
  return L.map(icsFold).join('\r\n') + '\r\n';
}

let toastT = null;
